<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的衣橱 · My Closet</title>
<meta name="description" content="Your clothes, photographed and organized, with mix and match. Works offline; everything stays on your phone.">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的衣橱">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Layout: a closet rail. Items are swing tags on a grid; Mix & Match stacks
   garment slots head-to-toe like a dressing-room mirror. */
:root{
  --bg:#eceef1; --surface:#ffffff; --sunk:#e2e5ea; --line:#d3d7de;
  --fg:#1d2230; --muted:#5f6677; --accent:#6a2a5b; --accent-ink:#ffffff; --accent-soft:#f1e3ee;
  --ok:#2f6b4f; --danger:#a3322e;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --f-body:"Figtree", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-tag:"IBM Plex Mono", "Noto Sans SC", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161c; --surface:#1d2029; --sunk:#252935; --line:#323746;
  --fg:#eceef3; --muted:#a2a8b8; --accent:#d58fc4; --accent-ink:#1a0f17; --accent-soft:#3a2234;
  --ok:#7cc4a0; --danger:#ef8a85; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14161c; --surface:#1d2029; --sunk:#252935; --line:#323746;
  --fg:#eceef3; --muted:#a2a8b8; --accent:#d58fc4; --accent-ink:#1a0f17; --accent-soft:#3a2234;
  --ok:#7cc4a0; --danger:#ef8a85; color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1100px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 18px}
h1{font:800 clamp(30px,6vw,46px)/1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{font:500 12px/1.4 var(--f-tag);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;font:600 15px var(--f-body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
nav.tabs .n{font:500 11px var(--f-tag);color:var(--muted);margin-left:4px}

.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.banner.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.banner.demo span{flex:1 1 260px;min-width:0}

/* filters */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font:500 11px var(--f-tag);opacity:.7;margin-left:3px}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px}

/* closet grid: swing tags */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--fg)}
.card .ph{aspect-ratio:3/4;max-width:100%;background:var(--sunk);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph img.back{position:absolute;inset:0;opacity:0;transition:opacity .25s}
.card:hover .ph img.back,.card:focus-visible .ph img.back{opacity:1}
.badge.backtag{left:auto;right:8px;top:auto;bottom:8px}
.check{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(20,22,30,.35);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.card[aria-pressed="true"],.ocard[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-1px}
.card[aria-pressed="true"] .check,.ocard[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ocard{text-align:left;position:relative;font:inherit;color:inherit;cursor:pointer}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selbar .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.selbar b{font-weight:600}
body.selecting{padding-bottom:96px}
.gallery{display:flex;gap:6px;flex-wrap:wrap}
.gallery button{border:2px solid transparent;border-radius:8px;padding:0;background:none;width:46px;position:relative}
.gallery button[aria-pressed="true"]{border-color:var(--accent)}
.gallery img{width:42px;height:56px;object-fit:cover;border-radius:6px;display:block;background:var(--sunk)}
.gallery small{display:block;font:500 9.5px var(--f-tag);color:var(--muted);text-align:center;letter-spacing:.04em}
.pvwrap{display:grid;gap:8px;align-content:start}
.flip{position:absolute;bottom:6px;left:6px;font:500 10px var(--f-tag);background:var(--surface);border-radius:999px;padding:1px 7px;letter-spacing:.05em}
.slot .frame .imgbtn{border:0;padding:0;background:none;position:relative;flex:none;border-radius:10px}
.card .meta{padding:10px 12px 12px;display:grid;gap:4px;min-width:0}
.card .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:500 10.5px/1.3 var(--f-tag);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:3px}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid color-mix(in srgb,var(--fg) 25%,transparent)}
.badge{position:absolute;top:8px;left:8px;background:var(--surface);border-radius:999px;padding:2px 8px;font:500 10.5px var(--f-tag);letter-spacing:.05em}
.badge.new{background:var(--accent);color:var(--accent-ink)}

/* empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center;background:var(--surface)}
.empty h2{font:700 22px var(--f-display);margin:0}
.empty p{color:var(--muted);margin:0;max-width:46ch}
.hanger{width:84px;height:auto;color:var(--muted)}

/* mix & match */
.mix{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:760px){.mix{grid-template-columns:minmax(0,1fr)}}
.mirror{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center}
.slot .frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;gap:12px;align-items:center;padding:8px;min-height:96px;position:relative}
.slot .frame img{width:96px;height:120px;object-fit:cover;border-radius:10px;background:var(--sunk);flex:none}
.slot .frame .blank{width:96px;height:120px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font:500 10.5px var(--f-tag);letter-spacing:.06em;flex:none;text-align:center}
.slot .info{min-width:0;display:grid;gap:3px}
.slot .info .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.arrow:hover{border-color:var(--fg)}
.lock{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font:500 11px var(--f-tag);letter-spacing:.04em}
.lock[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.side h3{margin:0;font:700 18px var(--f-display)}
.side label{font:500 11px var(--f-tag);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:grid;gap:6px}
.side input,.side select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-transform:none;letter-spacing:0;font:15px var(--f-body);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--muted);margin:0}

/* outfits */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.collage img,.collage span{width:100%;aspect-ratio:3/4;max-width:100%;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.ocard h4{margin:0;font:700 17px var(--f-display)}

/* sheet (dialog) */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet h2{margin:0;font:700 22px var(--f-display)}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x,.xbtn{border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;font-size:18px}
.edwrap{position:relative;max-width:100%;justify-self:center;border-radius:12px;overflow:hidden;background:var(--sunk);line-height:0}
.edwrap canvas{display:block;max-width:100%;max-height:58vh;width:auto;height:auto}
.edwrap #edMask{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;max-height:none}
.brush{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.brush input{width:110px;accent-color:var(--accent)}
.field{display:grid;gap:6px}
.field>span{font:500 11px var(--f-tag);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid color-mix(in srgb,var(--fg) 25%,transparent);padding:0;position:relative}
.sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.edit-item{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
@media (max-width:480px){.edit-item{grid-template-columns:minmax(0,1fr)}.edit-item .pv{max-width:180px}}
.pv{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--sunk)}
.queue-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12px var(--f-tag);color:var(--muted)}
.stats{display:flex;gap:18px;font:500 12px var(--f-tag);color:var(--muted);letter-spacing:.04em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:14px}
/* today + color match */
.today{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;margin-bottom:18px}
.today h3{margin:0;font:700 20px var(--f-display)}
.today .opts{display:flex;flex-wrap:wrap;gap:14px 24px}
.today .opts>div{display:grid;gap:6px}
.nudge{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:8px 12px 8px 8px;text-align:left;border:0;width:100%}
.nudge img{width:44px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--sunk)}
.nudge span{min-width:0;font-size:14px}
.answer{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.answer h4{margin:0;font:700 17px var(--f-display)}
.answer p{margin:0;max-width:65ch}
.answer .tip{color:var(--muted);font-size:14px}
.match{border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--sunk)}
.pill{justify-self:start;border-radius:999px;padding:2px 10px;font:500 11px var(--f-tag);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor}
.pill.great{color:var(--ok)} .pill.good{color:var(--fg)} .pill.bold{color:#b7791f} .pill.clash{color:var(--danger)} .pill.none{color:var(--muted)}
:root[data-theme="dark"] .pill.bold{color:#e8b45a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.bold{color:#e8b45a}}
.palette{display:flex;height:10px;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.palette i{flex:1}
.match p{margin:0;font-size:14px}
.toggle{display:flex!important;grid-auto-flow:column;align-items:center;gap:8px!important;text-transform:none!important;letter-spacing:0!important;font:14px var(--f-body)!important;color:var(--fg)!important}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.goes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.goes button{border:0;padding:0;background:none;flex:none;width:64px;text-align:left}
.goes img{width:64px;height:80px;object-fit:cover;border-radius:8px;display:block;background:var(--sunk)}
.goes small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.lang{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.lang:hover{border-color:var(--fg)}
.detect{display:flex;align-items:center;gap:8px;font-size:13px;border-radius:10px;padding:8px 12px;background:var(--accent-soft)}
.detect.fail{background:var(--sunk);color:var(--muted)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1 id="h1">My Closet</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="row">
      <button class="lang" type="button" id="backupBtn"></button>
      <button class="lang" type="button" id="langBtn" lang="zh">中文</button>
      <button class="btn primary" id="addBtn" type="button"></button>
      <input type="file" id="fileIn" accept="image/*" multiple hidden>
    </div>
  </header>

  <div class="banner" id="localBanner" hidden></div>
  <div class="banner demo" id="demoBanner" hidden><span id="demoText"></span><button class="btn" type="button" id="removeDemo"></button></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-closet" aria-selected="true" data-tab="closet"><span class="tl"></span> <span class="n" id="nItems">0</span></button>
    <button role="tab" id="tab-mix" aria-selected="false" data-tab="mix"><span class="tl"></span></button>
    <button role="tab" id="tab-outfits" aria-selected="false" data-tab="outfits"><span class="tl"></span> <span class="n" id="nOutfits">0</span></button>
  </nav>

  <section id="view-closet"></section>
  <section id="view-mix" hidden></section>
  <section id="view-outfits" hidden></section>
</div>

<div id="sheetHost"></div>
<div class="selbar" id="selBar" hidden><div class="in"><b id="selCount"></b><div class="row"><button class="btn ghost" type="button" id="selAll"></button><button class="btn ghost" type="button" id="selDone"></button><button class="btn danger" type="button" id="selDelete"></button></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= language ================= */
let LANG = "en";
try{ LANG = localStorage.getItem("closet-lang") || ((navigator.language||"").toLowerCase().startsWith("zh") ? "zh" : "en"); }catch(e){}
const STR = {
en:{
  title:"My Closet", add:"＋ Add clothes", loading:"Loading your closet…", emptySub:"Your closet is empty",
  sub:(n,o,u)=>`${n} pieces · ${o} outfits · ${u} not worn yet`,
  localBanner:"This browser isn't letting the app save (private browsing?), so anything you add disappears when you close it. Open it in a normal window to keep your closet.",
  demo:n=>`${n} pieces here are demo drawings so you can try the app. Remove them when you're ready to add your own clothes.`,
  removeDemo:"Remove demo pieces", tapAgainRemove:"Tap again to remove", removing:"Removing…", demoRemoved:"Demo pieces removed", demoRemoveFail:"Some demo pieces couldn't be removed. Try again.",
  tabCloset:"Closet", tabMix:"Mix & match", tabOutfits:"Saved outfits",
  emptyTitle:"Your closet is empty",
  emptyCloset:"Take a photo of each piece, laid flat or on a hanger, then add them here. The app cuts it out and puts it on white for you. Everything stays on this phone.",
  emptyMix:"Once you've added a few tops, bottoms and shoes, you can flip through combinations here and save the ones you like.",

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("my-closet",1);
    r.onupgradeneeded=()=>{ const d=r.result;
      for(const n of ["items","outfits"]) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:"id"});
      if(!d.objectStoreNames.contains("photos")) d.createObjectStore("photos"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error("blocked"));
  });
}
const idbWrite=(store,fn)=>new Promise((res,rej)=>{ const tx=IDB.transaction(store,"readwrite"); fn(tx.objectStore(store)); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error("aborted")); });
const idbAll=store=>new Promise((res,rej)=>{ const r=IDB.transaction(store).objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const idbEach=(store,fn)=>new Promise((res,rej)=>{ const r=IDB.transaction(store).objectStore(store).openCursor();
  r.onsuccess=()=>{ const c=r.result; if(!c) return res(); fn(c.key,c.value); c.continue(); }; r.onerror=()=>rej(r.error); });
const plain=o=>JSON.parse(JSON.stringify(o));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function snapOf(coll){ const docs=[...DATA[coll].values()].map(v=>{ const {id,...rest}=v; return {id, exists:true, data:()=>rest}; }); return {docs,size:docs.length,empty:!docs.length}; }
function emit(coll){ const s=snapOf(coll); LISTEN[coll].forEach(f=>{ try{ f(s); }catch(e){ console.error(e); } }); }
const localDb={
  collection(name){ return {
    onSnapshot(cb){ LISTEN[name].push(cb); cb(snapOf(name)); return ()=>{ LISTEN[name]=LISTEN[name].filter(f=>f!==cb); }; },
    async add(data){ const id=newId(); const v={...plain(data),id}; await idbWrite(name,st=>st.put(v)); DATA[name].set(id,v); emit(name); return {id}; },
    doc(id){ return localDb.doc(name+"/"+id); } }; },
  doc(path){ const [name,id]=path.split("/"); return {
    async get(){ const v=DATA[name].get(id); return {id, exists:!!v, data:()=>{ if(!v) return undefined; const {id:_,...r}=v; return r; }}; },
    async set(data){ const v={...plain(data),id}; await idbWrite(name,st=>st.put(v)); DATA[name].set(id,v); emit(name); },
    async update(patch){ const cur=DATA[name].get(id); if(!cur) throw new Error("not found"); const v={...cur,...plain(patch),id};
      for(const k of Object.keys(v)) if(v[k] && v[k].__delete__) delete v[k];
      await idbWrite(name,st=>st.put(v)); DATA[name].set(id,v); emit(name); },
    async delete(){ await idbWrite(name,st=>st.delete(id)); DATA[name].delete(id); emit(name); } }; }
};
const localAssets={
  async upload(blob){ const id=newId(); await idbWrite("photos",st=>st.put(blob,id)); const url=URL.createObjectURL(blob); URLS.set(id,url); return {id,url,sizeBytes:blob.size,contentType:blob.type}; },
  async delete(id){ await idbWrite("photos",st=>st.delete(id)); const u=URLS.get(id); if(u) URL.revokeObjectURL(u); URLS.delete(id); }
};
/* backups: the phone's share sheet when it can take files (save to Files, send to a chat), otherwise a normal download */
const localDownloads={
  async save({filename,data}){
    const blob = data instanceof Blob ? data : new Blob([data],{type:"application/json"});
    const file = new File([blob], filename, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:filename}); return; }
      catch(e){ if(e && e.name==="AbortError") throw {code:"declined"}; }
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },5000);
  }
};
async function openLocalStore(){
  IDB = await idbOpen();
  for(const c of ["items","outfits"]) for(const v of await idbAll(c)) DATA[c].set(v.id,v);
  await idbEach("photos",(k,b)=>URLS.set(k,URL.createObjectURL(b)));
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
}
async function boot(){
  applyLang();
  try{ await openLocalStore(); db=localDb; assets=localAssets; }catch(e){ console.warn("Storage unavailable:",e); db=null; assets=null; }
  downloads=localDownloads; sample=null; canSeeImages=false;   // no Claude here: manual tags and rule-based picks
  ready=true;
  if(!db){ local=true; $("#localBanner").hidden=false; render(); return; }
  db.collection("items").onSnapshot(snap=>{ items = snap.docs.map(d=>({id:d.id,...d.data()})); render(); },
    ()=>toast(t("loadFail")));
  db.collection("outfits").onSnapshot(snap=>{ outfits = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  if(!assets) $("#addBtn").hidden = true;
  render();
}
async function saveItem(data, file){
  if(local){ const id="l"+Math.random().toString(36).slice(2); items.push({id,...data,localUrl:URL.createObjectURL(file)}); render(); return id; }
  const up = await assets.upload(file);
  const ref = await db.collection("items").add({...data, assetId:up.id});
  return ref.id;
}
async function updateItem(id, patch){
  if(local){ Object.assign(byId(id),patch); render(); return; }
  await db.doc("items/"+id).update(patch);
}
async function deleteItem(id){
  const it=byId(id);
  if(local){ items=items.filter(i=>i.id!==id); render(); return; }
  await db.doc("items/"+id).delete();
  if(it?.assetId && assets){ try{ await assets.delete(it.assetId); }catch(e){} }
  if(assets) for(const ph of extraPhotos(it||{})){ try{ await assets.delete(ph.id); }catch(e){} }
}
/* store an extra photo (back or detail) on an item */
async function addPhoto(id, blob, kind){
  const it=byId(id); if(!it) return;
  if(local){ const photos=[...extraPhotos(it),{id:URL.createObjectURL(blob),kind}]; await updateItem(id,{photos}); return; }
  const up=await assets.upload(blob);
  const fresh=byId(id)||it;
  await updateItem(id,{photos:[...extraPhotos(fresh),{id:up.id,kind}]});
}
/* Claude describes what is special about the back, appended to the notes */
async function describeBack(id, blob){
  if(!(sample && canSeeImages)) return;
  try{
    const small=await shrink(blob,768,0.8);
    const lang = LANG==="zh" ? "Simplified Chinese" : "English";
    const txt=(await sample(`This photo shows the BACK of a clothing item. In ${lang}, describe only what is notable about the back (print, cut-out, lace-up, buttons, pleats, logo, open back), in at most 8 words. If nothing is special, reply with exactly: none`,{images:[small],modelTier:"quick"})).text.trim().replace(/^["'“]|["'”.。]$/g,"");

/* ---------- image shrink ---------- */
function shrink(file, max=1200, q=0.85){
  return new Promise((res)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{ URL.revokeObjectURL(url); res(b||file); },"image/jpeg",q);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

/* ---------- automatic recognition ---------- */
async function identify(blob){
  const small = await shrink(blob, 768, 0.8);
  const prompt = `Look at this photo of a clothing item from someone's wardrobe. Identify the single main item.
Reply with JSON only:
{"category": one of ${JSON.stringify(CAT_IDS)} (use "top" for shirts, blouses, sweaters, T-shirts; "bottom" for trousers, jeans, skirts, shorts; "dress" for dresses and jumpsuits; "set" for a matching set shown together, like a suit, co-ord, tracksuit or pajama set where top and bottom share the same fabric or print; "outerwear" for coats, jackets, blazers, cardigans worn open; "accessory" for scarves, hats, belts, jewelry, sunglasses. If a person is wearing several pieces, pick the piece the photo is about, usually the most prominent one),
 "onPerson": true if a person or mannequin is wearing the item in the photo, false if it is laid flat, hanging or standing alone,
 "colors": 1-3 main colors chosen only from ${JSON.stringify(COLOR_IDS.filter(c=>c!=="pattern"))}, listing the dominant color first; add "pattern" as well if it is striped, checked, floral, printed or dotted,
 "season": "aw" for warm or heavy items (wool, knits, coats, boots), "ss" for light summer items (linen, sandals, sleeveless), otherwise "all",
 "name": short English name, 2-5 words, like "Cream cable-knit sweater",
 "nameZh": the same name in Simplified Chinese, like "米色麻花毛衣",
 "notes": material or style details you can see, max 8 words in ${LANG==="zh"?"Simplified Chinese":"English"}, or ""}`;
  const a = await sample.json(prompt, {images:[small], modelTier:"quick"});
  const out = {};
  if(CAT_IDS.includes(a?.category)) out.category=a.category;
  if(Array.isArray(a?.colors)) out.colors=[...new Set(a.colors.filter(c=>COLOR_IDS.includes(c)))].slice(0,4);
  if(["all","ss","aw"].includes(a?.season)) out.season=a.season;
  if(typeof a?.name==="string") out.name=a.name.slice(0,60);
  if(typeof a?.nameZh==="string") out.nameZh=a.nameZh.slice(0,40);
  if(typeof a?.notes==="string") out.notes=a.notes.slice(0,120);
  out.onPerson = a?.onPerson===true;
  return out;
}

/* ---------- photo clean-up: cut out, even out light and color, white background ---------- */
/* Two models run in a background worker:
   flat   = general cut-out (garment laid flat or on a hanger), 320 px input
   person = clothing segmentation (background / upper / lower / full-body), 512 px input, for photos of someone wearing it */
const MILK = "#ffffff";   // photo background: pure white
const MODELS = {flat:{file:"model/silueta.part", parts:3, size:320}, person:{file:"model/cloth.part", parts:3, size:512}};
const PERSON_CLASSES = {top:[1], outerwear:[1,3], bottom:[2], dress:[1,2,3], set:[1,2,3]};
const CLEAN = {ready:null, failed:false, loaded:{}, seq:0, pending:new Map()};
function cleanWorker(){
  if(CLEAN.ready) return CLEAN.ready;
  CLEAN.ready = new Promise((res,rej)=>{
    try{
      const w=new Worker("worker.js?v=1.0.0");
      w.onmessage=e=>{
        const d=e.data;
        if(d.type==="ready") return res(w);
        if(d.type==="init-error") return rej(new Error(d.error));
        const p=CLEAN.pending.get(d.id); if(!p) return; CLEAN.pending.delete(d.id);
        d.error ? p.rej(new Error(d.error)) : p.res(d.out);
      };
      w.onerror=e=>rej(new Error(e.message||"worker failed"));
      w.postMessage({type:"init", base:new URL("./",location.href).href});
    }catch(err){ rej(err); }
  });
  CLEAN.ready.catch(err=>{ CLEAN.failed=true; console.warn("Photo clean-up unavailable:", err); });
  return CLEAN.ready;
}
async function runModel(model, input){
  const w=await cleanWorker(); const id=++CLEAN.seq;
  const out=await new Promise((res,rej)=>{ CLEAN.pending.set(id,{res,rej}); w.postMessage({type:"run",id,model,spec:MODELS[model],input},[input.buffer]); });
  CLEAN.loaded[model]=true;
  return out;
}
function loadImg(blob){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob); const im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("image")); }; im.src=u; });
}
const mkCanvas=(w,h)=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; };
const ctx2d=c=>c.getContext("2d",{willReadFrequently:true});
const toJpeg=(c,q=0.9)=>new Promise(res=>c.toBlob(res,"image/jpeg",q));

/* light, contrast and white balance; white balance only uses a neutral-looking background */
function correctColors(px, alpha, n){
  let gains=[1,1,1];
  if(alpha){
    let r=0,g=0,b=0,c=0;
    for(let p=0;p<n;p++) if(alpha[p]<0.1){ const i=p*4; r+=px[i]; g+=px[i+1]; b+=px[i+2]; c++; }
    if(c>0.05*n){
      const m=[r/c,g/c,b/c], mx=Math.max(...m), mn=Math.min(...m);
      if(mx>0 && (mx-mn)/mx<0.1){ const avg=(m[0]+m[1]+m[2])/3; gains=m.map(v=>Math.min(1.2,Math.max(0.85,Math.pow(avg/Math.max(v,1),0.8)))); }
    }
  }
  const hist=new Uint32Array(256);
  for(let p=0;p<n;p++){ const i=p*4; const L=0.299*px[i]*gains[0]+0.587*px[i+1]*gains[1]+0.114*px[i+2]*gains[2]; hist[Math.min(255,L|0)]++; }
  const pct=f=>{ let acc=0; const target=f*n; for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>=target) return v; } return 255; };
  const lo=pct(0.01), hi=pct(0.995), med=pct(0.5);
  const off = lo>12 ? (lo-12)*0.8 : 0;
  const gain = Math.min(1.7, Math.max(0.9, 242/Math.max(hi-off,1)));
  const gamma = (med-off)*gain < 100 ? 0.85 : 1;
  const lut=[0,1,2].map(ch=>{ const t=new Uint8ClampedArray(256);
    for(let v=0;v<256;v++){ let x=(v*gains[ch]-off)*gain; x=Math.min(255,Math.max(0,x)); t[v]=gamma===1?x:255*Math.pow(x/255,gamma); } return t; });
  for(let p=0;p<n;p++){ const i=p*4; px[i]=lut[0][px[i]]; px[i+1]=lut[1][px[i+1]]; px[i+2]=lut[2][px[i+2]]; }
}

/* photo → working canvas (max 1400 px) */
async function prepPhoto(blob){
  const img=await loadImg(blob);
  const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
  const W=Math.max(1,Math.round(img.naturalWidth*k)), H=Math.max(1,Math.round(img.naturalHeight*k));
  const c=mkCanvas(W,H), cx=ctx2d(c); cx.fillStyle="#fff"; cx.fillRect(0,0,W,H); cx.drawImage(img,0,0,W,H);
  return {W,H,c,px:cx.getImageData(0,0,W,H).data};
}
function modelInput(prep, S){
  const s=mkCanvas(S,S), sx=ctx2d(s); sx.drawImage(prep.c,0,0,S,S);
  const sd=sx.getImageData(0,0,S,S).data, N=S*S;
  let mx=1; for(let i=0;i<sd.length;i+=4) mx=Math.max(mx,sd[i],sd[i+1],sd[i+2]);
  const inp=new Float32Array(3*N);
  for(let p=0;p<N;p++){ const i=p*4; inp[p]=(sd[i]/mx-0.485)/0.229; inp[N+p]=(sd[i+1]/mx-0.456)/0.224; inp[2*N+p]=(sd[i+2]/mx-0.406)/0.225; }
  return inp;
}
/* a 0..1 plane at S×S → W×H via smooth canvas scaling */
function upsample(plane, S, W, H){
  const s=mkCanvas(S,S), sx=ctx2d(s), im=sx.createImageData(S,S);
  for(let p=0;p<S*S;p++){ const v=Math.max(0,Math.min(1,plane[p]))*255, i=p*4; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  sx.putImageData(im,0,0);
  const m=mkCanvas(W,H), mx=ctx2d(m); mx.imageSmoothingQuality="high"; mx.drawImage(s,0,0,W,H);
  const md=mx.getImageData(0,0,W,H).data, out=new Float32Array(W*H);
  for(let p=0;p<W*H;p++) out[p]=md[p*4]/255;
  return out;
}

/* drop stray patches: keep connected regions at least 15% the size of the largest one */
function keepMainRegions(plane,S){
  const N=S*S, lab=new Int32Array(N).fill(-1), sizes=[], stack=new Int32Array(N);
  for(let p=0;p<N;p++){
    if(plane[p]<=0.5 || lab[p]!==-1) continue;
    const id=sizes.length; let top=0, size=0; stack[top++]=p; lab[p]=id;
    while(top){ const q=stack[--top]; size++; const x=q%S, y=(q/S)|0;
      if(x>0   && lab[q-1]===-1 && plane[q-1]>0.5){ lab[q-1]=id; stack[top++]=q-1; }
      if(x<S-1 && lab[q+1]===-1 && plane[q+1]>0.5){ lab[q+1]=id; stack[top++]=q+1; }
      if(y>0   && lab[q-S]===-1 && plane[q-S]>0.5){ lab[q-S]=id; stack[top++]=q-S; }
      if(y<S-1 && lab[q+S]===-1 && plane[q+S]>0.5){ lab[q+S]=id; stack[top++]=q+S; } }
    sizes.push(size);
  }
  if(!sizes.length) return;
  const min=Math.max(...sizes)*0.15;
  const kept=l=>l>=0 && sizes[l]>=min;
  const src=Float32Array.from(plane);
  for(let p=0;p<N;p++){
    const l=lab[p];
    if(l>=0){ if(!kept(l)) plane[p]=0; continue; }
    if(src[p]<=0.2) continue;
    // soft edge pixel: keep only when it borders a kept region
    const x=p%S, y=(p/S)|0;
    const near=(x>0&&kept(lab[p-1]))||(x<S-1&&kept(lab[p+1]))||(y>0&&kept(lab[p-S]))||(y<S-1&&kept(lab[p+S]));
    if(!near) plane[p]=0;
  }
}

/* ---------- polish for photos of people ---------- */
/* square max/min filter (separable), r in pixels; dilate when max=true */
function morph(bin,S,r,max){
  const tmp=new Uint8Array(S*S), out=new Uint8Array(S*S);
  for(let y=0;y<S;y++){ const row=y*S;
    for(let x=0;x<S;x++){ let v=max?0:1; const a=Math.max(0,x-r), b=Math.min(S-1,x+r);
      for(let k=a;k<=b;k++){ const s=bin[row+k]; if(max? s : !s){ v=max?1:0; break; } } tmp[row+x]=v; } }
  for(let x=0;x<S;x++) for(let y=0;y<S;y++){ let v=max?0:1; const a=Math.max(0,y-r), b=Math.min(S-1,y+r);
      for(let k=a;k<=b;k++){ const s=tmp[k*S+x]; if(max? s : !s){ v=max?1:0; break; } } out[y*S+x]=v; }
  return out;
}
/* fill enclosed gaps (background not reachable from the border) smaller than maxArea */
function fillSmallHoles(bin,S,maxArea){
  const N=S*S, seen=new Uint8Array(N), stack=new Int32Array(N);
  let top=0;
  const push=p=>{ if(!bin[p] && !seen[p]){ seen[p]=1; stack[top++]=p; } };
  for(let i=0;i<S;i++){ push(i); push((S-1)*S+i); push(i*S); push(i*S+S-1); }
  while(top){ const q=stack[--top], x=q%S, y=(q/S)|0;
    if(x>0) push(q-1); if(x<S-1) push(q+1); if(y>0) push(q-S); if(y<S-1) push(q+S); }
  // remaining unseen background pixels form holes; measure each and fill the small ones
  const lab=new Int32Array(N).fill(-1);
  for(let p=0;p<N;p++){
    if(bin[p] || seen[p] || lab[p]!==-1) continue;
    const members=[]; top=0; stack[top++]=p; lab[p]=1;
    while(top){ const q=stack[--top]; members.push(q); const x=q%S, y=(q/S)|0;
      for(const nb of [x>0?q-1:-1, x<S-1?q+1:-1, y>0?q-S:-1, y<S-1?q+S:-1])
        if(nb>=0 && !bin[nb] && !seen[nb] && lab[nb]===-1){ lab[nb]=1; stack[top++]=nb; } }
    if(members.length<=maxArea) for(const q of members) bin[q]=1;
  }
}
function boxBlur(src,S,r){
  const tmp=new Float32Array(S*S), out=new Float32Array(S*S), w=2*r+1;
  for(let y=0;y<S;y++){ let acc=0; const row=y*S;
    for(let x=-r;x<=r;x++) acc+=src[row+Math.min(S-1,Math.max(0,x))];
    for(let x=0;x<S;x++){ tmp[row+x]=acc/w; acc+=src[row+Math.min(S-1,x+r+1)]-src[row+Math.max(0,x-r)]; } }
  for(let x=0;x<S;x++){ let acc=0;
    for(let y=-r;y<=r;y++) acc+=tmp[Math.min(S-1,Math.max(0,y))*S+x];
    for(let y=0;y<S;y++){ out[y*S+x]=acc/w; acc+=tmp[Math.min(S-1,y+r+1)*S+x]-tmp[Math.max(0,y-r)*S+x]; } }
  return out;
}
/* push-pull fill: paints pixels where known<0.5 from the surrounding known fabric */
function pushPullFill(px,known,W,H,region,grain=6){
  const levels=[]; let w=W, h=H;
  let C=new Float32Array(w*h*3), A=new Float32Array(w*h);
  for(let p=0;p<w*h;p++) if(known[p]){ A[p]=1; C[p*3]=px[p*4]; C[p*3+1]=px[p*4+1]; C[p*3+2]=px[p*4+2]; }
  levels.push({w,h,C,A});
  while(w>2 && h>2){
    const nw=Math.ceil(w/2), nh=Math.ceil(h/2), nC=new Float32Array(nw*nh*3), nA=new Float32Array(nw*nh);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const p=y*w+x, a=A[p]; if(!a) continue; const q=(y>>1)*nw+(x>>1);
      nA[q]+=a; nC[q*3]+=C[p*3]*a; nC[q*3+1]+=C[p*3+1]*a; nC[q*3+2]+=C[p*3+2]*a; }
    for(let q=0;q<nw*nh;q++) if(nA[q]){ nC[q*3]/=nA[q]; nC[q*3+1]/=nA[q]; nC[q*3+2]/=nA[q]; nA[q]=Math.min(1,nA[q]); }
    w=nw; h=nh; C=nC; A=nA; levels.push({w,h,C,A});
  }
  for(let l=levels.length-2;l>=0;l--){
    const f=levels[l], c=levels[l+1];
    for(let y=0;y<f.h;y++) for(let x=0;x<f.w;x++){ const p=y*f.w+x, a=f.A[p]; if(a>=1) continue;
      // bilinear sample of the coarser level, so filled areas blend smoothly instead of in blocks
      const cx=Math.min(c.w-1,Math.max(0,(x+0.5)/2-0.5)), cy=Math.min(c.h-1,Math.max(0,(y+0.5)/2-0.5));
      const x0=Math.floor(cx), y0=Math.floor(cy), x1=Math.min(c.w-1,x0+1), y1=Math.min(c.h-1,y0+1), fx=cx-x0, fy=cy-y0;
      const q00=y0*c.w+x0, q10=y0*c.w+x1, q01=y1*c.w+x0, q11=y1*c.w+x1;
      const w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
      for(let k=0;k<3;k++){
        const v=c.C[q00*3+k]*w00+c.C[q10*3+k]*w10+c.C[q01*3+k]*w01+c.C[q11*3+k]*w11;
        f.C[p*3+k]=f.C[p*3+k]*a+v*(1-a); }
      f.A[p]=1; }
  }
  const L=levels[0];
  for(let p=0;p<W*H;p++) if(region[p] && !known[p]){
    const g=(Math.random()-0.5)*grain;   // a little grain so filled areas don't look painted flat
    px[p*4]=L.C[p*3]+g; px[p*4+1]=L.C[p*3+1]+g; px[p*4+2]=L.C[p*3+2]+g; }
}
/* turns the raw garment plane (S×S, 0..1) into a tidy silhouette; returns {soft, orig} at S×S */
function polishSilhouette(plane,S){
  const N=S*S, bin=new Uint8Array(N); let area=0;
  for(let p=0;p<N;p++) if(plane[p]>0.5){ bin[p]=1; area++; }
  const orig=Uint8Array.from(bin);
  fillSmallHoles(bin,S,Math.round(area*0.02));
  const r=Math.max(2,Math.round(S*0.012));
  let closed=morph(morph(bin,S,r,true),S,r,false);   // close: bridge notches left by hands and hair
  fillSmallHoles(closed,S,Math.round(area*0.02));
  const opened=morph(morph(closed,S,2,false),S,2,true);  // open: drop thin slivers and spikes
  const f=new Float32Array(N); for(let p=0;p<N;p++) f[p]=opened[p];
  return {soft:boxBlur(f,S,2), orig};
}

/* cache: per-photo object holding the prepared image and model outputs, so changing category re-composes instantly.
   returns {blob, cut, model, mode} — mode is "flat", "person", "need-category" */
async function cleanPhoto(blob, {person=false, category="", cache={}}={}){
  cache.prep = cache.prep || await prepPhoto(blob);
  const {W,H,c,px:orig}=cache.prep, n=W*H;
  let mode = person ? (PERSON_CLASSES[category] ? "person" : (category ? "flat" : "need-category")) : "flat";
  let alpha=null, model=false, fillKnown=null;
  if(mode!=="need-category" && !CLEAN.failed){
    try{
      if(mode==="person"){
        const S=MODELS.person.size, N=S*S;
        cache.person = cache.person || await runModel("person", modelInput(cache.prep,S));
        const keep=PERSON_CLASSES[category], plane=new Float32Array(N);
        for(let p=0;p<N;p++){ let v=0; for(const k of keep) v+=cache.person[k*N+p]; plane[p]=v; }
        keepMainRegions(plane,S);
        const pol=polishSilhouette(plane,S);
        const up=upsample(pol.soft,S,W,H); alpha=new Float32Array(n);
        for(let p=0;p<n;p++) alpha[p]=Math.min(1,Math.max(0,(up[p]-0.3)/0.4));
        const of=new Float32Array(S*S); for(let p=0;p<S*S;p++) of[p]=pol.orig[p];
        const ku=upsample(of,S,W,H); fillKnown=new Uint8Array(n);
        for(let p=0;p<n;p++) fillKnown[p]=ku[p]>0.6?1:0;
      } else {
        const S=MODELS.flat.size;
        if(!cache.flat){
          const raw=await runModel("flat", modelInput(cache.prep,S));
          let lo=Infinity, hi=-Infinity; for(const v of raw){ if(v<lo) lo=v; if(v>hi) hi=v; }
          const span=Math.max(hi-lo,1e-6); cache.flat=raw.map(v=>(v-lo)/span);
        }
        const up=upsample(cache.flat,S,W,H); alpha=new Float32Array(n);
        for(let p=0;p<n;p++) alpha[p]=Math.min(1,Math.max(0,(up[p]-0.3)/0.4));
      }
      model=true;
      let fg=0; for(let p=0;p<n;p++) if(alpha[p]>0.5) fg++;
      if(fg<0.02*n || fg>0.95*n) alpha=null;
    }catch(e){ console.warn(e); alpha=null; }
  }
  const px=new Uint8ClampedArray(orig);
  correctColors(px, alpha, n);
  if(alpha && fillKnown){   // paint the gaps left by hands, arms and hair with the surrounding fabric
    const region=new Uint8Array(n); for(let p=0;p<n;p++) region[p]=alpha[p]>0.02?1:0;
    pushPullFill(px, fillKnown, W, H, region);
  }
  const id=new ImageData(px,W,H);

  if(!alpha){ const o=mkCanvas(W,H); o.getContext("2d").putImageData(id,0,0); return {blob:await toJpeg(o,0.88), cut:false, model, mode}; }

  // crop to the garment and place it on white with a soft shadow
  let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(alpha[y*W+x]>0.5){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const pad=Math.round(0.01*Math.max(W,H)); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(W-1,x1+pad); y1=Math.min(H-1,y1+pad);
  for(let p=0;p<n;p++) px[p*4+3]=Math.round(alpha[p]*255);
  const bw=x1-x0+1, bh=y1-y0+1;
  const cut=mkCanvas(bw,bh); cut.getContext("2d").putImageData(id,-x0,-y0,x0,y0,bw,bh);
  const OW=900, OH=1200, out=mkCanvas(OW,OH), ox=out.getContext("2d");
  ox.fillStyle=MILK; ox.fillRect(0,0,OW,OH);
  const s=Math.min(OW*0.8/bw, OH*0.78/bh), dw=bw*s, dh=bh*s, dx=(OW-dw)/2, dy=(OH-dh)*0.52;
  const sil=mkCanvas(bw,bh), sl=sil.getContext("2d"); sl.drawImage(cut,0,0); sl.globalCompositeOperation="source-in"; sl.fillStyle="#2a2a2a"; sl.fillRect(0,0,bw,bh);
  if(typeof ox.filter==="string"){  // soft shadow only where canvas blur is supported
    ox.filter="blur(16px)"; ox.globalAlpha=0.16; ox.drawImage(sil,dx+6,dy+14,dw,dh); ox.globalAlpha=1; ox.filter="none";
  }
  ox.imageSmoothingQuality="high"; ox.drawImage(cut,dx,dy,dw,dh);
  return {blob:await toJpeg(out,0.9), cut:true, model:true, mode};
}

/* ---------- color matching ---------- */
const NEUTRAL = new Set(["black","white","grey","beige","brown","navy"]);
const GOOD_PAIRS = {
  "blue|orange":"comp","purple|yellow":"comp","green|pink":"compFresh","blue|yellow":"bright","blue|red":"classic",
  "blue|pink":"soft","blue|purple":"smooth","blue|green":"smooth","pink|red":"tonal","orange|red":"warmRich",
  "orange|yellow":"warmSunny","green|yellow":"fresh","pink|purple":"tonal"
};
const REL = {
  en:{comp:"complementary colors, so they make each other stronger",compFresh:"complementary colors, a fresh and lively pair",bright:"a bright, high-contrast pair",
    classic:"a classic contrast pair",soft:"a soft contrast that feels easy",smooth:"neighbors on the color wheel, so they blend smoothly",
    tonal:"neighbors on the color wheel, a tonal look",warmRich:"neighbors on the color wheel, warm and rich",warmSunny:"neighbors on the color wheel, warm and sunny",fresh:"neighbors on the color wheel, fresh and natural"},
  zh:{comp:"是互补色，能互相衬托",compFresh:"是互补色，清新又活泼",bright:"对比鲜明，很亮眼",classic:"是经典的对比配色",soft:"对比柔和，很好驾驭",
    smooth:"在色环上相邻，过渡自然",tonal:"在色环上相邻，形成同色系层次",warmRich:"在色环上相邻，温暖饱满",warmSunny:"在色环上相邻，温暖明亮",fresh:"在色环上相邻，清新自然"}
};
const CLASH = new Set(["green|red","orange|pink","orange|purple"]);
const pairKey=(a,b)=>[a,b].sort().join("|");
const cap=s=>LANG==="zh"?s:s[0].toUpperCase()+s.slice(1);
const CC = {
  en:{
    labels:{none:"No colors tagged",clash:"Clashing",busy:"Busy",great:"Great match",bold:"Bold",good:"Good match",calm:"Calm neutrals"},
    none:()=>"Add colors to these pieces to get a color check.",
    clash:(a,b)=>`${cap(a)} and ${b} tend to fight each other. Swap one of them for a neutral.`,
    twoPat:()=>"Two patterned pieces compete for attention. Keep one pattern and make the rest solid.",
    many:l=>`${cap(l.join(", "))} is a lot of color at once. Two colors plus neutrals is easier to wear.`,
    pair:(a,b,r)=>`${cap(a)} and ${b} are ${r}. Neutrals around them keep it balanced.`,
    odd:(a,b)=>`${cap(a)} with ${b} is an unusual pair. It can work if everything else stays neutral.`,
    patAcc:a=>`A pattern plus a ${a} piece. Fine if the pattern contains some ${a}.`,
    one:a=>`One ${a} accent on neutrals. Simple and hard to get wrong.`,
    patNeutral:()=>"One pattern on neutrals lets the pattern be the star.",
    blackNavy:()=>"All neutrals. Black and navy together can look like a mismatch, so make the contrast clearly on purpose.",
    blackBrown:()=>"All neutrals. Black with brown works best when the brown is a rich tone, like leather.",
    neutral:()=>"All neutrals: calm and polished. A colored bag, scarf or shoe would lift it."
  },
  zh:{
    labels:{none:"未标颜色",clash:"撞色冲突",busy:"太花了",great:"很搭",bold:"大胆",good:"不错",calm:"沉稳中性"},
    none:()=>"给这些单品标注颜色后，就能检查配色。",
    clash:(a,b)=>`${a}和${b}容易互相冲突，建议把其中一件换成中性色。`,
    twoPat:()=>"两件图案单品会互相抢眼。保留一件图案，其余选纯色。",
    many:l=>`${l.join("、")}同时出现，颜色有点多。两种颜色加中性色会更好穿。`,
    pair:(a,b,r)=>`${a}和${b}${r}，再配上中性色，整体很平衡。`,
    odd:(a,b)=>`${a}配${b}比较少见，其余单品保持中性色就能驾驭。`,
    patAcc:a=>`一件图案单品加一件${a}单品，如果图案里带有${a}就很协调。`,
    one:a=>`中性色上点缀一抹${a}，简单又不容易出错。`,
    patNeutral:()=>"一件图案单品配中性色，让图案成为焦点。",
    blackNavy:()=>"全是中性色。黑色和藏青色放在一起容易像穿错了，对比要做得明显、刻意一些。",
    blackBrown:()=>"全是中性色。黑色配棕色时，棕色选皮革那样饱满的色调最好看。",
    neutral:()=>"全是中性色，沉稳又利落。加一个有颜色的包、围巾或鞋子会更出彩。"
  }
};
function colorCheck(ids){
  const L=CC[LANG], cn=colorName;
  const its=ids.map(byId).filter(Boolean);
  const tagged=its.filter(i=>(i.colors||[]).length);
  const all=tagged.flatMap(i=>i.colors);
  const colors=[...new Set(all)];
  const r=(level,lab,score,text)=>({level,label:L.labels[lab],score,text,colors});
  if(!tagged.length) return r("none","none",50,L.none());
  const accents=[...new Set(all.filter(c=>!NEUTRAL.has(c)&&c!=="pattern"))];
  const patterns=tagged.filter(i=>i.colors.includes("pattern")).length;
  for(let a=0;a<accents.length;a++) for(let b=a+1;b<accents.length;b++)
    if(CLASH.has(pairKey(accents[a],accents[b]))) return r("clash","clash",15,L.clash(cn(accents[a]),cn(accents[b])));
  if(patterns>=2) return r("bold","busy",40,L.twoPat());
  if(accents.length>=3) return r("bold","busy",35,L.many(accents.map(cn)));
  if(accents.length===2){
    const rel=GOOD_PAIRS[pairKey(...accents)];
    if(rel) return r("great","great",95,L.pair(cn(accents[0]),cn(accents[1]),REL[LANG][rel]));
    return r("bold","bold",60,L.odd(cn(accents[0]),cn(accents[1])));
  }
  if(accents.length===1){
    if(patterns) return r("good","good",78,L.patAcc(cn(accents[0])));
    return r("great","great",90,L.one(cn(accents[0])));
  }
  if(patterns) return r("great","great",88,L.patNeutral());
  const n=new Set(all);
  if(n.has("black")&&n.has("navy")) return r("good","good",70,L.blackNavy());
  if(n.has("black")&&n.has("brown")) return r("good","good",72,L.blackBrown());
  return r("good","calm",76,L.neutral());
}
function goesWith(it){
  const clashCats = (a,b)=> a===b || (ONE_PIECE.has(a)&&(b==="top"||b==="bottom"||ONE_PIECE.has(b))) || (ONE_PIECE.has(b)&&(a==="top"||a==="bottom"));
  return items.filter(o=>o.id!==it.id && !clashCats(it.category,o.category) && (o.colors||[]).length && (it.colors||[]).length)
    .map(o=>({o,s:colorCheck([it.id,o.id]).score})).filter(x=>x.s>=76)
    .sort((a,b)=>b.s-a.s || (a.o.wornCount||0)-(b.o.wornCount||0)).slice(0,10).map(x=>x.o);
}

async function deleteSelected(){
  const ids=[...SEL.ids], n=ids.length; SEL.busy=true; let done=0, failed=0;
  const del=$("#selDelete");
  try{
    if(SEL.tab==="closet"){
      const gone=new Set(ids);
      for(const id of ids){ del.textContent=t("deletingN")(done+1,n); try{ await deleteItem(id); }catch(e){ failed++; gone.delete(id); } done++; }
      for(const o of outfits.filter(o=>o.itemIds.some(x=>gone.has(x)))){   // keep outfits tidy: drop deleted pieces
        const left=o.itemIds.filter(x=>!gone.has(x));
        try{ left.length ? await updateOutfit(o.id,{itemIds:left}) : await deleteOutfit(o.id); }catch(e){}
      }
    } else {
      for(const id of ids){ del.textContent=t("deletingN")(done+1,n); try{ await deleteOutfit(id); }catch(e){ failed++; } done++; }
    }
  } finally { SEL.busy=false; }

/* ---------- mix & match ---------- */
function slotPool(slot, season=S.mix.season){
  return items.filter(i=>slot.cats.includes(i.category) &&
    (season==="any" || !i.season || i.season==="all" || i.season===season));
}
function dressOn(slots=S.mix.slots){ const x=byId(slots.top); return x && ONE_PIECE.has(x.category); }
function randomSlots(season){
  const slots={...S.mix.slots};
  for(const sl of SLOTS){
    if(S.mix.locks[sl.id]) continue;
    if(sl.id==="bottom" && dressOn(slots)){ slots.bottom=null; continue; }
    const pool=slotPool(sl,season);
    let pick=null;
    if(pool.length) pick = (!sl.optional || Math.random()<.6) ? pool[Math.floor(Math.random()*pool.length)].id : null;
    slots[sl.id]=pick;
  }
  if(dressOn(slots)) slots.bottom=null;
  else if(!slots.bottom){ const p=slotPool(SLOTS[2],season); if(p.length) slots.bottom=p[Math.floor(Math.random()*p.length)].id; }
  return slots;
}
function pickSlots(season, preferUnworn){
  if(!S.mix.smart) return randomSlots(season);
  const tries=[];
  for(let n=0;n<80;n++){
    const s=randomSlots(season); const ids=Object.values(s).filter(Boolean);
    let sc=colorCheck(ids).score;
    if(preferUnworn) sc += ids.reduce((a,id)=>a+(byId(id).wornCount?0:4),0);
    tries.push({s,sc});
  }
  const top=Math.max(...tries.map(x=>x.sc));
  const best=tries.filter(x=>x.sc>=top-6);
  return best[Math.floor(Math.random()*best.length)].s;
}
function shuffle(){ S.mix.slots = pickSlots(S.mix.season); S.mix.flip={}; }
function step(slotId,dir){
  const sl=SLOTS.find(s=>s.id===slotId); const pool=slotPool(sl).map(p=>p.id);
  const opts = sl.optional ? [null,...pool] : pool; if(!opts.length) return;
  let ix=opts.indexOf(S.mix.slots[slotId]); ix=(ix+dir+opts.length)%opts.length;
  S.mix.slots[slotId]=opts[ix]; if(S.mix.flip) S.mix.flip[slotId]=false;
  if(slotId==="top" && dressOn()) S.mix.slots.bottom=null;
  if(slotId==="top" && !dressOn() && !S.mix.slots.bottom){ const p=slotPool(SLOTS[2]); if(p.length) S.mix.slots.bottom=p[0].id; }
  renderMix();
}

            <div class="info">

async function doSaveOutfit(wear){

const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function nudgeItem(){
  const m=new Date().getMonth()+1, season=[4,5,6,7,8].includes(m)?"ss":"aw";
  let core=items.filter(i=>["top","bottom","dress","set","outerwear","shoes"].includes(i.category));
  const inSeason=core.filter(i=>!i.season||i.season==="all"||i.season===season);
  if(inSeason.length) core=inSeason;
  if(!core.length) return null;
  const sorted=[...core].sort((a,b)=>(a.wornCount?1:0)-(b.wornCount?1:0) || (a.lastWorn||"").localeCompare(b.lastWorn||"") || a.id.localeCompare(b.id));
  const day=Math.floor(Date.now()/864e5);
  return sorted[day % Math.min(5,sorted.length)];
}

  if(state==="busy"){
    const first = p ? !CLEAN.loaded.person : !CLEAN.loaded.flat;
    return `<div class="detect" role="status"><span class="spin" aria-hidden="true"></span>${first ? (p?t("cleanFirstPerson"):t("cleanFirst")) : (p?t("cleaningPerson"):t("cleaning"))}</div>`;
  }
  if(state==="done") return `<div class="detect" role="status">✦ ${p?t("cleanedPerson"):t("cleaned")}</div>`
    + (person && !PERSON_CLASSES[category] ? `<div class="detect fail" role="status">${t("personNoCls")}</div>` : "");
  if(state==="nocut") return `<div class="detect fail" role="status">${t("cleanedNoCut")}</div>`;
  if(state==="needcat") return `<div class="detect fail" role="status">${t("personNeedCat")}</div>`;
  if(state==="fail") return `<div class="detect fail" role="status">${t("cleanFail")}</div>`;
  return "";
}
/* runs (or re-runs) the clean-up for a photo record r = {file, person, d:{category}, cache, gen, ...} */
function recleanRecord(r, onDone){
  const gen = r.gen = (r.gen||0)+1;
  r.cl="busy"; onDone && onDone();
  r.cleanPromise = (async()=>{
    try{
      const res=await cleanPhoto(r.file,{person:r.person, category:r.d.category, cache:r.cache});
      if(gen!==r.gen) return;
      if(res.mode==="need-category"){ r.cl="needcat"; }
      else{
        if(r.cleanUrl) URL.revokeObjectURL(r.cleanUrl);
        r.clean=res.blob; r.cleanUrl=URL.createObjectURL(res.blob);
        r.cl = res.cut ? "done" : (res.model ? "nocut" : "fail");
      }
    }catch(e){ if(gen===r.gen) r.cl="fail"; }
    if(gen===r.gen) onDone && onDone();
  })();
  return r.cleanPromise;
}
async function startAdd(files){
  const auto = !!(sample && canSeeImages);
  const queue=[...files].filter(f=>f.type.startsWith("image/")).map(f=>({file:f,url:URL.createObjectURL(f),
    det: auto ? "wait" : (sample ? "off" : ""), cl:"busy", clean:null, cleanUrl:null, useOriginal:false, person:false, cache:{},
    d:{name:"",nameZh:"",category:"",colors:[],season:"all",notes:""}}));
  if(!queue.length) return;
  let ix=0, open=true;
  const preview = q => (!q.useOriginal && q.cleanUrl && q.cl!=="needcat") ? q.cleanUrl : q.url;
  const statusHtml = q => cleanStatusHtml(q.cl, q.person, q.d.category) + (q.det==="wait" ? "" : detectHtml(q.det))
    + `<label class="toggle"><input type="checkbox" id="personTg" ${q.person?"checked":""}> ${t("personToggle")}</label>`
    + (q.clean && q.cl!=="busy" && q.cl!=="needcat" ? `<label class="toggle"><input type="checkbox" id="useOrig" ${q.useOriginal?"checked":""}> ${t("useOriginal")}</label>` : "")
    + (q.cl!=="busy" ? `<div><button class="chip" type="button" id="logoQ">${t("removeLogo")}</button></div>` : "");
  const wireStatus = (root,q) => {
    const tg=root.querySelector("#useOrig");
    if(tg) tg.onchange=e=>{ q.useOriginal=e.target.checked; const pv=root.querySelector(".pv"); if(pv) pv.src=preview(q); };
    const lq=root.querySelector("#logoQ");
    if(lq) lq.onclick=()=>{
      const src=(!q.useOriginal && q.clean && q.cl!=="needcat") ? q.clean : q.file;
      openLogoEditor(src, blob=>{
        if(blob){ if(q.cleanUrl) URL.revokeObjectURL(q.cleanUrl); q.clean=blob; q.cleanUrl=URL.createObjectURL(blob); q.useOriginal=false; if(q.cl==="needcat"||q.cl==="fail") q.cl="nocut"; q.gen=(q.gen||0)+1; }
        show();
      });
    };
    const pt=root.querySelector("#personTg");
    if(pt) pt.onchange=e=>{ q.person=e.target.checked; q.personSetByUser=true; recleanRecord(q,()=>refresh(q,true)); };
  };
  const show=()=>{
    const q=queue[ix];
    const remaining=queue.filter(x=>!x.skip).length;
    openSheet(`<div class="head"><h2>${t("tagTitle")}</h2><button class="x" type="button" aria-label="${t("close")}">×</button></div>
      <div class="queue-nav"><span>${t("photoOf")(ix+1,queue.length)}</span><span>${!auto && queue.length>1?t("carry"):""}</span></div>
      <div class="edit-item"><img class="pv" src="${preview(q)}" alt="">
        <div class="field" style="gap:14px"><div id="statusBox" style="display:grid;gap:8px">${statusHtml(q)}</div>
          ${ix>0?`<label class="toggle"><input type="checkbox" id="backPrev" ${q.backOf?"checked":""}> ${t("backOfPrev")}</label>`:""}
          ${q.backOf?`<p class="note">${t("backOfPrevNote")}</p>`:tagFields(q.d)}</div></div>
      <p class="note" id="addErr" hidden></p>
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" type="button" id="prevQ" ${ix?"":"disabled"}>${t("back")}</button>
        <div class="row">
          <button class="btn ghost" type="button" id="skipQ">${t("skipPhoto")}</button>
          <button class="btn primary" type="button" id="nextQ">${ix<queue.length-1?t("nextPhoto"):t("addN")(remaining)}</button>
        </div></div>`, root=>{
      let lastCat=q.d.category;
      const bp=root.querySelector("#backPrev");
      if(bp) bp.onchange=e=>{ q.backOf=e.target.checked;
        if(q.backOf){ const prev=queue.slice(0,ix).reverse().find(x=>!x.backOf&&!x.skip); if(prev){ q.d.category=prev.d.category; if(prev.person!==q.person && !q.personSetByUser){ q.person=prev.person; } recleanRecord(q,()=>refresh(q,true)); } }
        show(); };
      if(!q.backOf) wireTagFields(root,q.d,()=>{ if(q.d.category!==lastCat){ lastCat=q.d.category; if(q.person) recleanRecord(q,()=>refresh(q,true)); } });
      wireStatus(root,q);
      root.querySelector("#prevQ").onclick=()=>{ ix--; show(); };
      root.querySelector("#skipQ").onclick=()=>{ q.skip=true; advance(); };
      root.querySelector("#nextQ").onclick=()=>{
        if(!q.backOf && !q.d.category){ const e=root.querySelector("#addErr"); e.hidden=false; e.textContent=t("pickCat"); return; }
        q.skip=false; advance();
      };
    });
    closeSheet.onClose=()=>{ open=false; };
  };
  // statusOnly: only patch the picture and status lines (keeps what the person is typing)
  const refresh=(q,statusOnly)=>{
    if(!open || queue[ix]!==q) return;
    if(!statusOnly && !q.d._edited){ show(); return; }
    const root=document.querySelector(".sheet"); if(!root) return;
    const pv=root.querySelector(".pv"); if(pv) pv.src=preview(q);
    const sb=root.querySelector("#statusBox"); if(sb){ sb.innerHTML=statusHtml(q); wireStatus(root,q); }
  };
  const advance=()=>{
    if(ix<queue.length-1){
      const prev=queue[ix].d; ix++; const n=queue[ix];
      if(!auto && !n.d.category && !n.seen){ n.d.category=prev.category; n.d.season=prev.season; }
      n.seen=true; show();
    } else upload();
  };
  const upload=async()=>{
    open=false;
    const todo=queue.filter(q=>!q.skip && (q.d.category || q.backOf));
    openSheet(`<div class="head"><h2>${t("adding")}</h2></div><div class="progress"><i id="bar"></i></div><p class="note" id="upMsg">${t("ofN")(0,todo.length)}</p>`);
    let done=0, failed=0, lastId=null;
    for(const q of todo){
      try{
        if(!q.useOriginal && q.cleanPromise && q.cl==="busy"){ const m=$("#upMsg"); if(m) m.textContent=t("cleanWait"); await q.cleanPromise; }
        const blob = (!q.useOriginal && q.clean && q.cl!=="needcat") ? q.clean : await shrink(q.file);
        if(q.backOf){
          if(!lastId) throw new Error("no previous piece");
          await addPhoto(lastId, blob, "back"); describeBack(lastId, q.file);
        } else lastId = await saveItem({name:q.d.name.trim(),nameZh:(q.d.nameZh||"").trim(),category:q.d.category,colors:q.d.colors,season:q.d.season,notes:q.d.notes.trim(),
          onPerson:!!q.person, addedAt:new Date().toISOString(),wornCount:0,lastWorn:null}, blob);
      }catch(e){ failed++; if(!q.backOf) lastId=null; }
      done++; const bar=$("#bar"); if(bar) bar.style.width=(done/todo.length*100)+"%";
      const m=$("#upMsg"); if(m) m.textContent=t("ofN")(done,todo.length);
    }
    queue.forEach(q=>{ URL.revokeObjectURL(q.url); if(q.cleanUrl) URL.revokeObjectURL(q.cleanUrl); });
    closeSheet.onClose=null; closeSheet();
    toast(failed? t("addedSome")(todo.length-failed,failed) : t("addedN")(todo.length));
    S.tab="closet"; render();
  };
  show();

  // background pipeline: Claude looks at each photo first (type, colors, and whether someone is wearing it),
  // then the photo is cleaned with the right cut-out. Cleaning runs one photo at a time.
  if(auto){
    let next=0;
    const worker=async()=>{
      while(next<queue.length){
        const q=queue[next++];
        q.det="busy"; refresh(q,true);
        q.detPromise=(async()=>{
          try{ const found=await identify(q.file);
            if(!q.d._edited) mergeDetected(q.d,found);
            if(!q.personSetByUser) q.person=!!found.onPerson;
            q.det = found.category ? "done" : "fail"; }
          catch(e){ q.det = e?.code==="not_granted" ? "off" : "fail"; }
        })();
        await q.detPromise; refresh(q);
      }
    };
    worker(); worker();
  }
  (async()=>{
    for(const q of queue){
      if(auto){ while(!q.detPromise) await new Promise(r=>setTimeout(r,100)); await q.detPromise; }
      if(q.gen) { await q.cleanPromise; continue; }   // already started by a toggle
      await recleanRecord(q,()=>refresh(q,true));
    }
  })();
}

      const ce=root.querySelector("#cleanIt");

/* ---------- logo / watermark remover ---------- */
/* done(blob) with the edited photo, or done(null) when nothing changed or the person cancelled */
function openLogoEditor(srcBlob, done){
  let W=0,H=0, base=null, maskC=null, mctx=null, size=4, history=[], changed=false, status="", busy=false, garmentBoxes=[];
  const finish=async save=>{
    if(save && changed){ done(await toJpeg(base,0.92)); } else done(null);
  };
  const markBox=(b,pad=0.015)=>{
    const x=Math.max(0,(b.x-pad)*W), y=Math.max(0,(b.y-pad)*H), w=Math.min(W-x,(b.w+2*pad)*W), h=Math.min(H-y,(b.h+2*pad)*H);
    mctx.fillStyle="#f00"; mctx.fillRect(x,y,w,h);
  };
  const draw=()=>{
    openSheet(`<div class="head"><h2>${t("logoTitle")}</h2><button class="xbtn" type="button" id="edClose" aria-label="${t("close")}">×</button></div>
      <p class="note" style="max-width:60ch">${t("logoIntro")}</p>
      <div class="edwrap"><canvas id="edBase"></canvas><canvas id="edMask"></canvas></div>
      <div class="row" style="align-items:center">
        <label class="brush">${t("brush")} <input type="range" id="edSize" min="1" max="12" step="0.5" value="${size}"></label>
        ${sample&&canSeeImages?`<button class="chip" type="button" id="edAuto" ${busy?"disabled":""}>${t("autoFind")}</button>`:""}
        ${garmentBoxes.length?`<button class="chip" type="button" id="edGarment">${t("garmentLogos")(garmentBoxes.length)}</button>`:""}
        <button class="chip" type="button" id="edUndo" ${history.length?"":"disabled"}>${t("undo")}</button>
        <button class="chip" type="button" id="edClear">${t("clearMarks")}</button>
      </div>
      ${status?`<div class="detect ${status.fail?"fail":""}" role="status">${status.busy?'<span class="spin" aria-hidden="true"></span>':""}${esc(status.text)}</div>`:""}
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" type="button" id="edCancel">${t("cancel")}</button>
        <div class="row"><button class="btn" type="button" id="edApply" ${busy?"disabled":""}>${t("applyRemove")}</button>
          <button class="btn primary" type="button" id="edSave" ${busy||!changed?"disabled":""}>${t("saveImg")}</button></div>
      </div>`, root=>{
      if(!base) return;
      const bc=root.querySelector("#edBase"), mc=root.querySelector("#edMask");
      bc.width=W; bc.height=H; bc.getContext("2d").drawImage(base,0,0);
      mc.width=W; mc.height=H; const ov=mc.getContext("2d");
      const paintOverlay=()=>{ ov.clearRect(0,0,W,H); ov.globalAlpha=0.45; ov.drawImage(maskC,0,0); ov.globalAlpha=1; };
      paintOverlay();
      let down=false, lx=0, ly=0;
      const pos=e=>{ const r=mc.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H]; };
      const stroke=(x,y)=>{ mctx.strokeStyle="#f00"; mctx.lineCap="round"; mctx.lineJoin="round"; mctx.lineWidth=size/100*Math.max(W,H);
        mctx.beginPath(); mctx.moveTo(lx,ly); mctx.lineTo(x,y); mctx.stroke(); lx=x; ly=y; paintOverlay(); };
      mc.addEventListener("pointerdown",e=>{ e.preventDefault(); mc.setPointerCapture(e.pointerId); down=true;
        history.push(mctx.getImageData(0,0,W,H)); if(history.length>12) history.shift();
        [lx,ly]=pos(e); stroke(lx+0.01,ly); root.querySelector("#edUndo").disabled=false; });
      mc.addEventListener("pointermove",e=>{ if(down){ const [x,y]=pos(e); stroke(x,y); } });
      const up=()=>{ down=false; }; mc.addEventListener("pointerup",up); mc.addEventListener("pointercancel",up);
      root.querySelector("#edSize").oninput=e=>{ size=+e.target.value; };
      root.querySelector("#edUndo").onclick=()=>{ const h=history.pop(); if(h){ mctx.putImageData(h,0,0); } draw(); };
      root.querySelector("#edClear").onclick=()=>{ history.push(mctx.getImageData(0,0,W,H)); mctx.clearRect(0,0,W,H); draw(); };
      root.querySelector("#edClose").onclick=()=>finish(false);
      root.querySelector("#edCancel").onclick=()=>finish(false);
      root.querySelector("#edSave").onclick=()=>finish(true);
      root.querySelector("#edGarment")?.addEventListener("click",()=>{ history.push(mctx.getImageData(0,0,W,H)); garmentBoxes.forEach(b=>markBox(b,0.008)); garmentBoxes=[]; draw(); });
      root.querySelector("#edApply").onclick=()=>{
        const m=mctx.getImageData(0,0,W,H).data, n=W*H, region=new Uint8Array(n), known=new Uint8Array(n); let any=0;
        for(let p=0;p<n;p++){ if(m[p*4+3]>20){ region[p]=1; any++; } else known[p]=1; }
        if(!any){ status={text:t("markFirst"),fail:true}; draw(); return; }
        const bx=ctx2d(base), id=bx.getImageData(0,0,W,H);
        pushPullFill(id.data, known, W, H, region, 2);
        bx.putImageData(id,0,0);
        mctx.clearRect(0,0,W,H); history=[]; changed=true; status={text:t("removed")}; draw();
      };
      root.querySelector("#edAuto")?.addEventListener("click",async()=>{
        busy=true; status={text:t("finding"),busy:true}; draw();
        try{
          const small=await shrink(await toJpeg(base,0.9),1024,0.85);
          const a=await sample.json(`Find logos, watermarks, shop names, text overlays, stickers or price tags in this clothing photo.
Reply with JSON only: {"overlays":[{"x":0,"y":0,"w":0,"h":0}], "garment":[{"x":0,"y":0,"w":0,"h":0}]}
- "overlays": marks added on top of the photo or on the background (watermarks, shop logos, semi-transparent text, stickers, price tags).
- "garment": brand logos or text printed, embroidered or sewn onto the clothing itself.
x, y = top-left corner, w, h = size, all as fractions (0-1) of the image width and height. Make each box cover the whole mark. Use empty lists when there are none.`,{images:[small],modelTier:"default"});
          const ok=b=>b && [b.x,b.y,b.w,b.h].every(v=>typeof v==="number" && v>=0 && v<=1) && b.w>0 && b.h>0 && b.w*b.h<0.35;
          const ov=(a?.overlays||[]).filter(ok); garmentBoxes=(a?.garment||[]).filter(ok);
          if(ov.length){ history.push(mctx.getImageData(0,0,W,H)); ov.forEach(b=>markBox(b)); }
          const total=ov.length+garmentBoxes.length;
          status = total ? {text:t("foundN")(total)} : {text:t("foundNone")};
          if(!ov.length && garmentBoxes.length) status={text:t("foundN")(garmentBoxes.length)};
        }catch(e){ status={text:t("findFail"),fail:true}; }
        busy=false; draw();
      });
    }, {sticky:true});
  };
  (async()=>{
    try{
      const img=await loadImg(srcBlob);
      const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      W=Math.max(1,Math.round(img.naturalWidth*k)); H=Math.max(1,Math.round(img.naturalHeight*k));
      base=mkCanvas(W,H); const bx=ctx2d(base); bx.fillStyle="#fff"; bx.fillRect(0,0,W,H); bx.drawImage(img,0,0,W,H);
      maskC=mkCanvas(W,H); mctx=maskC.getContext("2d",{willReadFrequently:true});
      draw();
    }catch(e){ done(null); }
  })();
}

/* ---------- backup: export / import ---------- */
const blobToDataUrl = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
function dataUrlToBlob(u){
  const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(u||""); if(!m) throw new Error("bad image");
  const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:m[1]||"image/jpeg"});
}
async function fetchImage(src){ const r=await fetch(src); if(!r.ok) throw new Error("image "+r.status); return blobToDataUrl(await r.blob()); }
const ITEM_FIELDS=["name","nameZh","category","colors","season","notes","addedAt","wornCount","lastWorn","onPerson","demo"];
const OUTFIT_FIELDS=["name","nameZh","itemIds","createdAt","wornCount","lastWorn","demo"];
const pickFields=(o,f)=>{ const r={}; for(const k of f) if(o[k]!==undefined) r[k]=o[k]; return r; };

function openBackup(){
  let last=""; try{ last=localStorage.getItem("closet-last-backup")||""; }catch(e){}
  let withDemo=false;
  const draw=(msg,busy)=>{
    const list=items.filter(i=>withDemo||!i.demo);
    openSheet(`<div class="head"><h2>${t("backupTitle")}</h2><button class="x" type="button" aria-label="${t("close")}">×</button></div>
      <p style="margin:0;max-width:60ch">${t("backupIntro")}</p>
      ${items.some(i=>i.demo)?`<label class="toggle"><input type="checkbox" id="bkDemo" ${withDemo?"checked":""}> ${t("includeDemo")}</label>`:""}
      <div class="row"><button class="btn primary" type="button" id="bkExport" ${busy||!list.length?"disabled":""}>${t("exportBtn")}</button>
        <span class="note" style="align-self:center">${t("backupSize")(list.length, Math.max(1,Math.round(list.reduce((a,i)=>a+0.25*(1+extraPhotos(i).length),0))))}</span></div>
      ${last?`<p class="note">${t("lastBackup")(new Date(last).toLocaleString(LANG==="zh"?"zh-CN":undefined,{dateStyle:"medium",timeStyle:"short"}))}</p>`:""}
      <hr style="border:0;border-top:1px solid var(--line);margin:4px 0;width:100%">
      <p class="note" style="max-width:60ch">${t("importIntro")}</p>
      <div class="row"><button class="btn" type="button" id="bkImport" ${busy||!(assets||local)?"disabled":""}>${t("importBtn")}</button>
        <input type="file" id="bkFile" accept=".json,application/json" hidden></div>
      ${msg?`<div class="detect ${msg.fail?"fail":""}" role="status">${msg.busy?'<span class="spin" aria-hidden="true"></span>':""}${esc(msg.text)}</div>`:""}`, root=>{
      root.querySelector("#bkDemo")?.addEventListener("change",e=>{ withDemo=e.target.checked; draw(); });
      root.querySelector("#bkExport").onclick=()=>doExport();
      root.querySelector("#bkImport").onclick=()=>root.querySelector("#bkFile").click();
      root.querySelector("#bkFile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) doImport(f); };
    });
  };
  const doExport=async()=>{
    if(!downloads){ draw({text:t("exportUnavailable"),fail:true}); return; }
    const list=items.filter(i=>withDemo||!i.demo);
    const ids=new Set(list.map(i=>i.id));
    const total=list.reduce((a,i)=>a+1+extraPhotos(i).length,0); let done=0;
    try{
      const outItems=[];
      for(const it of list){
        draw({text:t("packing")(done,total),busy:true},true);
        const rec={id:it.id, ...pickFields(it,ITEM_FIELDS), image:await fetchImage(imgSrc(it)), photos:[]}; done++;
        for(const ph of extraPhotos(it)){ rec.photos.push({kind:ph.kind, image:await fetchImage(blobSrc(ph.id))}); done++; }
        outItems.push(rec);
      }
      const outOutfits=outfits.filter(o=>o.itemIds.every(x=>ids.has(x))).map(o=>({id:o.id,...pickFields(o,OUTFIT_FIELDS)}));
      const json=JSON.stringify({app:"my-closet",version:1,exportedAt:new Date().toISOString(),items:outItems,outfits:outOutfits});
      await downloads.save({filename:`closet-backup-${today()}.json`, data:new Blob([json],{type:"application/json"})});
      try{ last=new Date().toISOString(); localStorage.setItem("closet-last-backup",last); }catch(e){}
      draw({text:t("exportDone")});
    }catch(e){
      const c=e?.code;
      draw({text: c==="declined" ? t("exportDeclined") : (["unavailable","not_granted","capability_disabled","capability_removed"].includes(c) ? t("exportUnavailable") : t("exportFail")), fail:true});
    }
  };
  const doImport=async file=>{
    let data;
    try{ data=JSON.parse(await file.text()); if(data?.app!=="my-closet" || !Array.isArray(data.items)) throw 0; }
    catch(e){ draw({text:t("importBad"),fail:true}); return; }
    const have=new Set(items.flatMap(i=>[i.id,i.srcId].filter(Boolean)));
    let added=0, skipped=0, failed=0, n=0;
    for(const rec of data.items){
      n++; draw({text:t("importing")(n,data.items.length),busy:true},true);
      if(!rec?.id || have.has(rec.id)){ skipped++; continue; }
      try{
        const fields=pickFields(rec,ITEM_FIELDS);
        if(!CAT_IDS.includes(fields.category)) throw new Error("category");
        const main=dataUrlToBlob(rec.image);
        if(local){
          const photos=(rec.photos||[]).map(ph=>({id:URL.createObjectURL(dataUrlToBlob(ph.image)),kind:ph.kind}));
          items.push({id:rec.id,...fields,srcId:rec.id,localUrl:URL.createObjectURL(main),photos});
        } else {
          const up=await assets.upload(main);
          const photos=[];
          for(const ph of rec.photos||[]){ const u=await assets.upload(dataUrlToBlob(ph.image)); photos.push({id:u.id,kind:ph.kind==="back"?"back":(ph.kind==="front"?"front":"detail")}); }
          await db.doc("items/"+rec.id).set({...fields,srcId:rec.id,assetId:up.id,photos});
        }
        have.add(rec.id); added++;
      }catch(e){ failed++; }
    }
    let addedOutfits=0;
    const haveOutfits=new Set(outfits.flatMap(o=>[o.id,o.srcId].filter(Boolean)));
    for(const o of data.outfits||[]){
      if(!o?.id || haveOutfits.has(o.id) || !Array.isArray(o.itemIds) || !o.itemIds.every(x=>have.has(x))) continue;
      try{
        const fields={...pickFields(o,OUTFIT_FIELDS),srcId:o.id};
        if(local) outfits.push({id:o.id,...fields}); else await db.doc("outfits/"+o.id).set(fields);
        addedOutfits++;
      }catch(e){}
    }
    if(local) render();
    draw({text: failed ? t("importFail")(failed) : t("importDone")(added,addedOutfits,skipped), fail:!!failed});
  };
  draw();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ S.tab=b.dataset.tab; rememberUi(); render(); }
  else if(b.dataset.cat){ S.cat=b.dataset.cat; renderCloset(); }
  else if(b.dataset.item){ if(SEL.on) toggleSel(b.dataset.item); else openItem(b.dataset.item); }
  else if(b.dataset.osel) toggleSel(b.dataset.osel);
  else if(b.dataset.style) styleAround(b.dataset.style);
  else if(b.dataset.act==="add") $("#fileIn").click();
  else if(b.dataset.goto){ S.tab=b.dataset.goto; render(); }
  else if(b.dataset.step) step(b.dataset.step,+b.dataset.dir);
  else if(b.dataset.flip){ S.mix.flip=S.mix.flip||{}; S.mix.flip[b.dataset.flip]=!S.mix.flip[b.dataset.flip]; renderMix(); }
  else if(b.dataset.lock){ S.mix.locks[b.dataset.lock]=!S.mix.locks[b.dataset.lock]; renderMix(); }
  else if(b.dataset.wear){ const o=outfits.find(x=>x.id===b.dataset.wear); markWorn(o).then(()=>toast(t("loggedWorn"))).catch(()=>toast(t("saveFailShort"))); }
  else if(b.dataset.load){ const o=outfits.find(x=>x.id===b.dataset.load);
    SLOTS.forEach(s=>{ S.mix.slots[s.id]=null; S.mix.locks[s.id]=false; });
    o.itemIds.forEach(id=>{ const it=byId(id); if(!it) return; const s=ONE_PIECE.has(it.category)?"top":it.category; S.mix.slots[s]=id; S.mix.locks[s]=true; });
    renderMix.started=true; S.today.answer=null; S.tab="mix"; render(); }
  else if(b.dataset.delout){
    if(b.dataset.armed) deleteOutfit(b.dataset.delout).then(()=>toast(t("outfitDeleted")));
    else { b.dataset.armed="1"; b.textContent=t("tapAgain"); }
  }
});
$("#langBtn").onclick=()=>{ LANG = LANG==="zh"?"en":"zh"; try{ localStorage.setItem("closet-lang",LANG); }catch(e){}
  S.today.answer=null; applyLang(); render(); };
$("#addBtn").onclick=()=>$("#fileIn").click();
$("#backupBtn").onclick=()=>openBackup();
$("#selDone").onclick=()=>{ endSelect(); render(); };
$("#selAll").onclick=()=>{ const all=SEL.visible.every(id=>SEL.ids.has(id)); SEL.ids = all ? new Set() : new Set(SEL.visible); SEL.armed=false; render(); };
$("#selDelete").onclick=()=>{ if(!SEL.ids.size||SEL.busy) return; if(!SEL.armed){ SEL.armed=true; renderSelBar(); return; } deleteSelected(); };
$("#fileIn").onchange=e=>{ const f=e.target.files; if(f&&f.length) startAdd(f); e.target.value=""; };
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{ e.preventDefault(); if(e.dataTransfer.files.length && (assets||local)) startAdd(e.dataTransfer.files); });
$("#removeDemo").onclick=async e=>{
  const b=e.currentTarget;
  if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=t("tapAgainRemove"); return; }
  b.disabled=true; b.textContent=t("removing");
  try{
    const demoIds=new Set(items.filter(i=>i.demo).map(i=>i.id));
    for(const o of outfits.filter(o=>o.demo || o.itemIds.every(id=>demoIds.has(id)))) await deleteOutfit(o.id);
    for(const id of demoIds) await deleteItem(id);
    toast(t("demoRemoved"));
  }catch(err){ toast(t("demoRemoveFail")); }
  b.disabled=false; delete b.dataset.armed; b.textContent=t("removeDemo");
};

boot();
</script>
