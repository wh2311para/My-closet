    prefilled:!!pre, d:{name:"",nameZh:"",category:"",colors:[],season:"all",notes:"",notesZh:"", ...(pre?{name:pre.name||"",nameZh:pre.nameZh||"",category:pre.category||"",colors:[...(pre.colors||[])],season:pre.season||"all",notes:pre.notes||"",notesZh:pre.notesZh||""}:{})}}));
  if(!queue.length) return;
  let ix=0, open=true;
  const preview = q => (!q.useOriginal && q.cleanUrl && q.cl!=="needcat") ? q.cleanUrl : q.url;
  const statusHtml = q => cleanStatusHtml(q.cl, q.person, q.d.category) + (q.det==="wait" ? "" : detectHtml(q.det))
    + `<label class="toggle"><input type="checkbox" id="personTg" ${q.person?"checked":""}> ${t("personToggle")}</label>`
    + (q.clean && q.cl!=="busy" && q.cl!=="needcat" ? `<label class="toggle"><input type="checkbox" id="useOrig" ${q.useOriginal?"checked":""}> ${t("useOriginal")}</label>` : "")
    + (q.cl!=="busy" ? `<div><button class="chip" type="button" id="logoQ">${t("removeLogo")}</button></div>` : "");
  const wireStatus = (root,q) => {
    const tg=root.querySelector("#useOrig");
    if(tg) tg.onchange=e=>{ q.useOriginal=e.target.checked; const pv=root.querySelector(".pv"); if(pv) pv.src=preview(q); };
    const lq=root.querySelector("#logoQ");
    if(lq) lq.onclick=()=>{
      const src=(!q.useOriginal && q.clean && q.cl!=="needcat") ? q.clean : q.file;
      openLogoEditor(src, blob=>{
        if(blob){ if(q.cleanUrl) URL.revokeObjectURL(q.cleanUrl); q.clean=blob; q.cleanUrl=URL.createObjectURL(blob); q.useOriginal=false; if(q.cl==="needcat"||q.cl==="fail") q.cl="nocut"; q.gen=(q.gen||0)+1; }
        show();
      });
    };
    const pt=root.querySelector("#personTg");
    if(pt) pt.onchange=e=>{ q.person=e.target.checked; q.personSetByUser=true; recleanRecord(q,()=>refresh(q,true)); };
  };
  const show=()=>{
    const q=queue[ix];
    const remaining=queue.filter(x=>!x.skip).length;
    openSheet(`<div class="head"><h2>${t("tagTitle")}</h2><button class="x" type="button" aria-label="${t("close")}">×</button></div>
      <div class="queue-nav"><span>${t("photoOf")(ix+1,queue.length)}</span><span>${!auto && queue.length>1?t("carry"):""}</span></div>
      <div class="edit-item"><img class="pv" src="${preview(q)}" alt="">
        <div class="field" style="gap:14px"><div id="statusBox" style="display:grid;gap:8px">${statusHtml(q)}</div>
          ${ix>0?`<label class="toggle"><input type="checkbox" id="backPrev" ${q.backOf?"checked":""}> ${t("backOfPrev")}</label>`:""}
          ${q.backOf?`<p class="note">${t("backOfPrevNote")}</p>`:tagFields(q.d)}</div></div>
      <p class="note" id="addErr" hidden></p>
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" type="button" id="prevQ" ${ix?"":"disabled"}>${t("back")}</button>
        <div class="row">
          <button class="btn ghost" type="button" id="skipQ">${t("skipPhoto")}</button>
          <button class="btn primary" type="button" id="nextQ">${ix<queue.length-1?t("nextPhoto"):t("addN")(remaining)}</button>
        </div></div>`, root=>{
      let lastCat=q.d.category;
      const bp=root.querySelector("#backPrev");
      if(bp) bp.onchange=e=>{ q.backOf=e.target.checked;
        if(q.backOf){ const prev=queue.slice(0,ix).reverse().find(x=>!x.backOf&&!x.skip); if(prev){ q.d.category=prev.d.category; if(prev.person!==q.person && !q.personSetByUser){ q.person=prev.person; } recleanRecord(q,()=>refresh(q,true)); } }
        show(); };
      if(!q.backOf) wireTagFields(root,q.d,()=>{ if(q.d.category!==lastCat){ lastCat=q.d.category; if(q.person) recleanRecord(q,()=>refresh(q,true)); } });
      wireStatus(root,q);
      root.querySelector("#prevQ").onclick=()=>{ ix--; show(); };
      root.querySelector("#skipQ").onclick=()=>{ q.skip=true; advance(); };
      root.querySelector("#nextQ").onclick=()=>{
        if(!q.backOf && !q.d.category){ const e=root.querySelector("#addErr"); e.hidden=false; e.textContent=t("pickCat"); return; }
        q.skip=false; advance();
      };
    });
    closeSheet.onClose=()=>{ open=false; };
  };
  // statusOnly: only patch the picture and status lines (keeps what the person is typing)
  const refresh=(q,statusOnly)=>{
    if(!open || queue[ix]!==q) return;
    if(!statusOnly && !q.d._edited){ show(); return; }
    const root=document.querySelector(".sheet"); if(!root) return;
    const pv=root.querySelector(".pv"); if(pv) pv.src=preview(q);
    const sb=root.querySelector("#statusBox"); if(sb){ sb.innerHTML=statusHtml(q); wireStatus(root,q); }
  };
  const advance=()=>{
    if(ix<queue.length-1){
      const prev=queue[ix].d; ix++; const n=queue[ix];
      if(!auto && !n.d.category && !n.seen){ n.d.category=prev.category; n.d.season=prev.season; }
      n.seen=true; show();
    } else upload();
  };
  const upload=async()=>{
    open=false;
    const todo=queue.filter(q=>!q.skip && (q.d.category || q.backOf));
    openSheet(`<div class="head"><h2>${t("adding")}</h2></div><div class="progress"><i id="bar"></i></div><p class="note" id="upMsg">${t("ofN")(0,todo.length)}</p>`);
    let done=0, failed=0, lastId=null;
    for(const q of todo){
      try{
        if(!q.useOriginal && q.cleanPromise && q.cl==="busy"){ const m=$("#upMsg"); if(m) m.textContent=t("cleanWait"); await q.cleanPromise; }
        const blob = (!q.useOriginal && q.clean && q.cl!=="needcat") ? q.clean : await shrink(q.file);
        if(q.backOf){
          if(!lastId) throw new Error("no previous piece");
          await addPhoto(lastId, blob, "back"); describeBack(lastId, q.file);
        } else lastId = await saveItem({name:q.d.name.trim(),nameZh:(q.d.nameZh||"").trim(),category:q.d.category,colors:q.d.colors,season:q.d.season,notes:(q.d.notes||"").trim(),notesZh:(q.d.notesZh||"").trim(),
          onPerson:!!q.person, addedAt:new Date().toISOString(),wornCount:0,lastWorn:null}, blob);
      }catch(e){ failed++; if(!q.backOf) lastId=null; }
      done++; const bar=$("#bar"); if(bar) bar.style.width=(done/todo.length*100)+"%";
      const m=$("#upMsg"); if(m) m.textContent=t("ofN")(done,todo.length);
    }
    queue.forEach(q=>{ URL.revokeObjectURL(q.url); if(q.cleanUrl) URL.revokeObjectURL(q.cleanUrl); });
    closeSheet.onClose=null; closeSheet();
    toast(failed? t("addedSome")(todo.length-failed,failed) : t("addedN")(todo.length));
    setTimeout(translateMissingNotes,800);
    S.tab="closet"; render();
  };
  show();

  // background pipeline: Claude looks at each photo first (type, colors, and whether someone is wearing it),
  // then the photo is cleaned with the right cut-out. Cleaning runs one photo at a time.
  if(auto){
    let next=0;
    const worker=async()=>{
      while(next<queue.length){
        const q=queue[next++];
        if(q.prefilled){ q.detPromise=Promise.resolve(); continue; }
        q.det="busy"; refresh(q,true);
        q.detPromise=(async()=>{
          try{ const found=await identify(q.file);
            if(!q.d._edited) mergeDetected(q.d,found);
            if(!q.personSetByUser) q.person=!!found.onPerson;
            q.det = found.category ? "done" : "fail"; }
          catch(e){ q.det = e?.code==="not_granted" ? "off" : "fail"; }
        })();
        await q.detPromise; refresh(q);
      }
    };
    worker(); worker();
  }
  (async()=>{
    for(const q of queue){
      if(auto && !q.prefilled){ while(!q.detPromise) await new Promise(r=>setTimeout(r,100)); await q.detPromise; }
      if(q.gen) { await q.cleanPromise; continue; }   // already started by a toggle
      await recleanRecord(q,()=>refresh(q,true));
    }
  })();
}

function openItem(id){
  const it=byId(id); if(!it) return;
  const d={name:it.name||"",nameZh:it.nameZh||"",category:it.category,colors:[...(it.colors||[])],season:it.season||"all",notes:it.notes||"",notesZh:it.notesZh||""};
  let det="", cl="", person=!!it.onPerson, view=0, photoBusy=false, pendingKind="back";
  const inOutfits=outfits.filter(o=>o.itemIds.includes(id));
  const canClean = !it.demo && !local && assets;
  const canPhotos = !!(assets || local);
  const KIND={front:"kFront",back:"kBack",detail:"kDetail"};
  const draw=()=>{
    const cur=byId(id)||it;
    const views=[{src:imgSrc(cur),kind:"front",main:true}, ...extraPhotos(cur).map(ph=>({src:blobSrc(ph.id),kind:ph.kind,id:ph.id}))];
    if(view>=views.length) view=0;
    const v=views[view];
    openSheet(`<div class="head"><h2>${esc(nameOf(cur))}</h2><button class="x" type="button" aria-label="${t("close")}">×</button></div>
    <div class="edit-item"><div class="pvwrap"><img class="pv" src="${v.src}" alt="">
        ${views.length>1?`<div class="gallery" role="group" aria-label="${t("photos")}">${views.map((x,i)=>`<button type="button" data-view="${i}" aria-pressed="${i===view}"><img src="${x.src}" alt=""><small>${t(KIND[x.kind]||"kDetail")}</small></button>`).join("")}</div>`:""}
        ${canPhotos?`<div class="row">
          ${photoBusy?`<span class="note"><span class="spin" style="display:inline-block;vertical-align:-2px"></span> ${t("addingPhoto")}</span>`:`
          ${extraPhotos(cur).some(ph=>ph.kind==="back")?"":`<button class="chip" type="button" id="addBack">${t("addBack")}</button>`}
          <button class="chip" type="button" id="addDetail">${t("addDetail")}</button>`}
          ${!photoBusy?`<button class="chip" type="button" id="logoIt">${t("removeLogo")}</button>`:""}
          ${!v.main&&!photoBusy?`<button class="chip" type="button" id="setMain">${t("setMain")}</button><button class="chip" type="button" id="rmPhoto">${t("removePhoto")}</button>`:""}
          <input type="file" id="morePhoto" accept="image/*" hidden></div>`:""}
      </div>
      <div class="field" style="gap:14px">
        <div class="stats"><span>${t("wornN")(cur.wornCount||0)}</span><span>${cur.lastWorn?t("lastD")(fmtDate(cur.lastWorn)):t("never")}</span><span>${t("inOutfits")(inOutfits.length)}</span></div>
        ${cleanStatusHtml(cl, person, d.category)}${detectHtml(det)}
        ${tagFields(d)}</div></div>
    ${(()=>{ const g=goesWith(cur);
      if(!(cur.colors||[]).length) return `<p class="note">${t("tagColorsFirst")}</p>`;
      if(!g.length) return `<p class="note">${t("noColorMatch")}</p>`;
      return `<div class="field"><span>${t("goesWith")}</span><div class="goes">${g.map(o=>`<button type="button" data-goes="${o.id}"><img src="${imgSrc(o)}" alt=""><small>${esc(nameOf(o))}</small></button>`).join("")}</div></div>`; })()}
    ${canClean?`<label class="toggle"><input type="checkbox" id="personIt" ${person?"checked":""}> ${t("personToggle")}</label>`:""}
    <div class="row" style="justify-content:space-between">
      <button class="btn danger" type="button" id="delIt">${t("del")}</button>
      <div class="row">
        ${canClean?`<button class="btn ghost" type="button" id="cleanIt" ${cl==="busy"?"disabled":""}>${t("cleanUp")}</button>`:""}
        ${sample&&canSeeImages&&!cur.demo?`<button class="btn ghost" type="button" id="reId" ${det==="busy"?"disabled":""}>${t("reidentify")}</button>`:""}
        <button class="btn" type="button" id="styleIt">${t("styleThis")}</button>
        <button class="btn primary" type="button" id="saveIt">${t("saveChanges")}</button></div>
    </div>`, root=>{
      wireTagFields(root,d);
      root.querySelector("#saveIt").onclick=async()=>{ try{
        const {_edited,_notesEdited,...clean}=d;
        const cur=(d[notesField()]||"").trim(), prev=((byId(id)||it)[notesField()]||"").trim();
        const patch={...clean,name:d.name.trim(),nameZh:d.nameZh.trim(),notes:(d.notes||"").trim(),notesZh:(d.notesZh||"").trim()};
        if(_notesEdited && cur!==prev){ patch[otherNotesField()]=""; TRANS.delete(id); }       // redo the other language from the new text
        await updateItem(id,patch); closeSheet(); toast(t("saved")); translateMissingNotes(); }catch(e){ toast(t("saveFailShort")); } };
      root.querySelector("#styleIt").onclick=()=>{ closeSheet(); styleAround(id); };
      root.querySelectorAll("[data-goes]").forEach(b=>b.onclick=()=>openItem(b.dataset.goes));
      const pi=root.querySelector("#personIt"); if(pi) pi.onchange=e=>{ person=e.target.checked; };
      root.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ view=+b.dataset.view; draw(); });
      const mp=root.querySelector("#morePhoto");
      const pick=kind=>{ pendingKind=kind; mp.click(); };
      root.querySelector("#addBack")?.addEventListener("click",()=>pick("back"));
      root.querySelector("#addDetail")?.addEventListener("click",()=>pick("detail"));
      if(mp) mp.onchange=async e=>{
        const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
        photoBusy=true; draw();
        try{
          let blob;
          try{ const r=await cleanPhoto(f,{person, category:d.category}); blob = (r.model && r.mode!=="need-category") ? r.blob : await shrink(f); }
          catch(err){ blob=await shrink(f); }
          await addPhoto(id, blob, pendingKind);
          view=extraPhotos(byId(id)||it).length;
          toast(t("photoAdded"));
          if(pendingKind==="back") describeBack(id, f).then(()=>{ const c=byId(id)||{}; if(!d._edited){ d.notes=c.notes||""; d.notesZh=c.notesZh||""; } if($("#scrim")) draw(); });
        }catch(err){ toast(t("photoFail")); }
        photoBusy=false; if($("#scrim")) draw();
      };
      root.querySelector("#logoIt")?.addEventListener("click",async()=>{
        let src; try{ src=await (await fetch(v.src)).blob(); }catch(e){ toast(t("photoFail")); return; }
        openLogoEditor(src, async blob=>{
          if(blob){
            photoBusy=true; draw();
            try{
              const c=byId(id)||it;
              if(local){ const u=URL.createObjectURL(blob);
                if(v.main) await updateItem(id,{localUrl:u}); else await updateItem(id,{photos:extraPhotos(c).map(ph=>ph.id===v.id?{...ph,id:u}:ph)}); }
              else { const up=await assets.upload(blob);
                if(v.main){ await updateItem(id,{assetId:up.id}); try{ await assets.delete(c.assetId); }catch(e){} }
                else { await updateItem(id,{photos:extraPhotos(c).map(ph=>ph.id===v.id?{...ph,id:up.id}:ph)}); try{ await assets.delete(v.id); }catch(e){} } }
              toast(t("logoSaved"));
            }catch(e){ toast(t("saveFailShort")); }
            photoBusy=false;
          }
          draw();
        });
      });
      root.querySelector("#setMain")?.addEventListener("click",async()=>{
        const c=byId(id)||it, others=extraPhotos(c).filter(ph=>ph.id!==v.id);
        try{
          if(local) await updateItem(id,{localUrl:v.id, photos:[{id:c.localUrl,kind:"front"},...others]});
          else await updateItem(id,{assetId:v.id, photos:[{id:c.assetId,kind:"front"},...others]});
          view=0; draw();
        }catch(err){ toast(t("saveFailShort")); }
      });
      root.querySelector("#rmPhoto")?.addEventListener("click",async e=>{
        const b=e.currentTarget;
        if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=t("tapDel"); return; }
        const c=byId(id)||it;
        try{ await updateItem(id,{photos:extraPhotos(c).filter(ph=>ph.id!==v.id)}); if(!local&&assets){ try{ await assets.delete(v.id); }catch(err){} } view=0; draw(); }
        catch(err){ toast(t("delFail")); }
      });
      const re=root.querySelector("#reId");
      if(re) re.onclick=async()=>{
        det="busy"; draw();
        try{ const r=await fetch(imgSrc(byId(id)||it)); const blob=await r.blob(); const found=await identify(blob); mergeDetected(d,found); if(found.notes) d.notes=found.notes; if(found.notesZh) d.notesZh=found.notesZh; det = found.category?"done":"fail"; }
        catch(e){ det = e?.code==="not_granted" ? "off" : "fail"; }
        if($("#scrim")) draw();
      };
      const ce=root.querySelector("#cleanIt");
      if(ce) ce.onclick=async()=>{
        cl="busy"; draw();
        try{
          const cur=byId(id)||it;
          const r=await fetch(imgSrc(cur)); if(!r.ok) throw new Error("fetch");
          const res=await cleanPhoto(await r.blob(),{person, category:d.category});
          if(res.mode==="need-category"){ cl="needcat"; }
          else if(!res.model){ cl="fail"; }
          else{
            const up=await assets.upload(res.blob);
            const old=cur.assetId;
            await updateItem(id,{assetId:up.id, onPerson:person});
            if(old && old!==up.id){ try{ await assets.delete(old); }catch(e){} }
            cl = res.cut ? "done" : "nocut";
            toast(t("cleanedSaved"));
          }
        }catch(e){ cl="fail"; }
        if($("#scrim")) draw();
      };
      root.querySelector("#delIt").onclick=e=>{
        const b=e.currentTarget;
        if(b.dataset.armed){ deleteItem(id).then(()=>{ closeSheet(); toast(t("deleted")); }).catch(()=>toast(t("delFail"))); }
        else { b.dataset.armed="1"; b.textContent=inOutfits.length?t("delUsed")(inOutfits.length):t("tapDel"); }
      };
    });
  };
  draw();
}

/* ---------- logo / watermark remover ---------- */
/* done(blob) with the edited photo, or done(null) when nothing changed or the person cancelled */
function openLogoEditor(srcBlob, done){
  let W=0,H=0, base=null, maskC=null, mctx=null, size=4, history=[], changed=false, status="", busy=false, garmentBoxes=[];
  const finish=async save=>{
    if(save && changed){ done(await toJpeg(base,0.92)); } else done(null);
  };
  const markBox=(b,pad=0.015)=>{
    const x=Math.max(0,(b.x-pad)*W), y=Math.max(0,(b.y-pad)*H), w=Math.min(W-x,(b.w+2*pad)*W), h=Math.min(H-y,(b.h+2*pad)*H);
    mctx.fillStyle="#f00"; mctx.fillRect(x,y,w,h);
  };
  const draw=()=>{
    openSheet(`<div class="head"><h2>${t("logoTitle")}</h2><button class="xbtn" type="button" id="edClose" aria-label="${t("close")}">×</button></div>
      <p class="note" style="max-width:60ch">${t("logoIntro")}</p>
      <div class="edwrap"><canvas id="edBase"></canvas><canvas id="edMask"></canvas></div>
      <div class="row" style="align-items:center">
        <label class="brush">${t("brush")} <input type="range" id="edSize" min="1" max="12" step="0.5" value="${size}"></label>
        ${sample&&canSeeImages?`<button class="chip" type="button" id="edAuto" ${busy?"disabled":""}>${t("autoFind")}</button>`:""}
        ${garmentBoxes.length?`<button class="chip" type="button" id="edGarment">${t("garmentLogos")(garmentBoxes.length)}</button>`:""}
        <button class="chip" type="button" id="edUndo" ${history.length?"":"disabled"}>${t("undo")}</button>
        <button class="chip" type="button" id="edClear">${t("clearMarks")}</button>
      </div>
      ${status?`<div class="detect ${status.fail?"fail":""}" role="status">${status.busy?'<span class="spin" aria-hidden="true"></span>':""}${esc(status.text)}</div>`:""}
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" type="button" id="edCancel">${t("cancel")}</button>
        <div class="row"><button class="btn" type="button" id="edApply" ${busy?"disabled":""}>${t("applyRemove")}</button>
          <button class="btn primary" type="button" id="edSave" ${busy||!changed?"disabled":""}>${t("saveImg")}</button></div>
      </div>`, root=>{
      if(!base) return;
      const bc=root.querySelector("#edBase"), mc=root.querySelector("#edMask");
      bc.width=W; bc.height=H; bc.getContext("2d").drawImage(base,0,0);
      mc.width=W; mc.height=H; const ov=mc.getContext("2d");
      const paintOverlay=()=>{ ov.clearRect(0,0,W,H); ov.globalAlpha=0.45; ov.drawImage(maskC,0,0); ov.globalAlpha=1; };
      paintOverlay();
      let down=false, lx=0, ly=0;
      const pos=e=>{ const r=mc.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H]; };
      const stroke=(x,y)=>{ mctx.strokeStyle="#f00"; mctx.lineCap="round"; mctx.lineJoin="round"; mctx.lineWidth=size/100*Math.max(W,H);
        mctx.beginPath(); mctx.moveTo(lx,ly); mctx.lineTo(x,y); mctx.stroke(); lx=x; ly=y; paintOverlay(); };
      mc.addEventListener("pointerdown",e=>{ e.preventDefault(); mc.setPointerCapture(e.pointerId); down=true;
        history.push(mctx.getImageData(0,0,W,H)); if(history.length>12) history.shift();
        [lx,ly]=pos(e); stroke(lx+0.01,ly); root.querySelector("#edUndo").disabled=false; });
      mc.addEventListener("pointermove",e=>{ if(down){ const [x,y]=pos(e); stroke(x,y); } });
      const up=()=>{ down=false; }; mc.addEventListener("pointerup",up); mc.addEventListener("pointercancel",up);
      root.querySelector("#edSize").oninput=e=>{ size=+e.target.value; };
      root.querySelector("#edUndo").onclick=()=>{ const h=history.pop(); if(h){ mctx.putImageData(h,0,0); } draw(); };
      root.querySelector("#edClear").onclick=()=>{ history.push(mctx.getImageData(0,0,W,H)); mctx.clearRect(0,0,W,H); draw(); };
      root.querySelector("#edClose").onclick=()=>finish(false);
      root.querySelector("#edCancel").onclick=()=>finish(false);
      root.querySelector("#edSave").onclick=()=>finish(true);
      root.querySelector("#edGarment")?.addEventListener("click",()=>{ history.push(mctx.getImageData(0,0,W,H)); garmentBoxes.forEach(b=>markBox(b,0.008)); garmentBoxes=[]; draw(); });
      root.querySelector("#edApply").onclick=()=>{
        const m=mctx.getImageData(0,0,W,H).data, n=W*H, region=new Uint8Array(n), known=new Uint8Array(n); let any=0;
        for(let p=0;p<n;p++){ if(m[p*4+3]>20){ region[p]=1; any++; } else known[p]=1; }
        if(!any){ status={text:t("markFirst"),fail:true}; draw(); return; }
        const bx=ctx2d(base), id=bx.getImageData(0,0,W,H);
        pushPullFill(id.data, known, W, H, region, 2);
        bx.putImageData(id,0,0);
        mctx.clearRect(0,0,W,H); history=[]; changed=true; status={text:t("removed")}; draw();
      };
      root.querySelector("#edAuto")?.addEventListener("click",async()=>{
        busy=true; status={text:t("finding"),busy:true}; draw();
        try{
          const small=await shrink(await toJpeg(base,0.9),1024,0.85);
          const a=await sample.json(`Find logos, watermarks, shop names, text overlays, stickers or price tags in this clothing photo.
Reply with JSON only: {"overlays":[{"x":0,"y":0,"w":0,"h":0}], "garment":[{"x":0,"y":0,"w":0,"h":0}]}
- "overlays": marks added on top of the photo or on the background (watermarks, shop logos, semi-transparent text, stickers, price tags).
- "garment": brand logos or text printed, embroidered or sewn onto the clothing itself.
x, y = top-left corner, w, h = size, all as fractions (0-1) of the image width and height. Make each box cover the whole mark. Use empty lists when there are none.`,{images:[small],modelTier:"default"});
          const ok=b=>b && [b.x,b.y,b.w,b.h].every(v=>typeof v==="number" && v>=0 && v<=1) && b.w>0 && b.h>0 && b.w*b.h<0.35;
          const ov=(a?.overlays||[]).filter(ok); garmentBoxes=(a?.garment||[]).filter(ok);
          if(ov.length){ history.push(mctx.getImageData(0,0,W,H)); ov.forEach(b=>markBox(b)); }
          const total=ov.length+garmentBoxes.length;
          status = total ? {text:t("foundN")(total)} : {text:t("foundNone")};
          if(!ov.length && garmentBoxes.length) status={text:t("foundN")(garmentBoxes.length)};
        }catch(e){ status={text:t("findFail"),fail:true}; }
        busy=false; draw();
      });
    }, {sticky:true});
  };
  (async()=>{
    try{
      const img=await loadImg(srcBlob);
      const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      W=Math.max(1,Math.round(img.naturalWidth*k)); H=Math.max(1,Math.round(img.naturalHeight*k));
      base=mkCanvas(W,H); const bx=ctx2d(base); bx.fillStyle="#fff"; bx.fillRect(0,0,W,H); bx.drawImage(img,0,0,W,H);
      maskC=mkCanvas(W,H); mctx=maskC.getContext("2d",{willReadFrequently:true});
      draw();
    }catch(e){ done(null); }
  })();
}

/* ---------- before you buy: compare a piece you're considering with what you own ---------- */
let SHOP = {stage:"idle"};
const SHOP_VERDICT = {buy:{cls:"great",key:"vBuy"}, think:{cls:"bold",key:"vThink"}, skip:{cls:"clash",key:"vSkip"}};

/* everything that can be worked out from tags alone: similar candidates, what it pairs with, outfit count */
function shopLocal(d, maxTries=20000){
  const V={id:"__new", category:d.category, colors:[...(d.colors||[])], season:d.season||"all", wornCount:0};
  items.push(V);
  try{
    const cset=new Set(V.colors.filter(c=>c!=="pattern")), pat=V.colors.includes("pattern");
    const sameKind=(a,b)=> a===b || (ONE_PIECE.has(a)&&ONE_PIECE.has(b));
    const cands=items.filter(i=>i.id!=="__new" && sameKind(i.category,V.category)).map(i=>{
      const own=(i.colors||[]).filter(c=>c!=="pattern"); let inter=0; own.forEach(c=>{ if(cset.has(c)) inter++; });
      const uni=new Set([...own,...cset]).size||1;
      let sc=inter/uni;
      if(pat===(i.colors||[]).includes("pattern")) sc+=0.15;
      if((i.colors||[])[0] && i.colors[0]===V.colors[0]) sc+=0.2;
      if(i.category!==V.category) sc-=0.25;
      return {id:i.id, sc};
    }).sort((a,b)=>b.sc-a.sc);

    const conflicts=(a,b)=> a===b || (ONE_PIECE.has(a)&&(b==="top"||b==="bottom"||ONE_PIECE.has(b))) || (ONE_PIECE.has(b)&&(a==="top"||a==="bottom"));
    const ok=id=>colorCheck(["__new",id]).score>=76;
    const pairs={};
    for(const c of CAT_IDS) if(!conflicts(V.category,c)) pairs[c]=items.filter(i=>i.id!=="__new" && i.category===c && ok(i.id)).map(i=>i.id);

    // build outfits around the new piece: top+bottom+shoes, or dress/set+shoes; outerwear, bags and accessories ride on top
    const vc=V.category, own=c=>items.some(i=>i.id!=="__new" && i.category===c);
    const pool=c=> vc===c ? ["__new"] : (pairs[c]||[]);
    const shoes = vc==="shoes" ? ["__new"] : (own("shoes") ? pool("shoes") : [null]);
    const extra = ["outerwear","bag","accessory"].includes(vc) ? ["__new"] : [];
    const forms=[];
    if(!ONE_PIECE.has(vc)){ const tp=pool("top"), bt=pool("bottom"); if(tp.length && bt.length) forms.push([tp,bt,shoes]); }
    if(vc!=="top" && vc!=="bottom"){ const op=ONE_PIECE.has(vc)?["__new"]:[...(pairs.dress||[]),...(pairs.set||[])]; if(op.length) forms.push([op,shoes]); }
    let combos=0, tries=0; const found=[];
    outer: for(const f of forms){
      const walk=(k,acc)=>{
        if(tries>maxTries) return;
        if(k===f.length){ tries++;
          const ids=[...acc,...extra].filter(Boolean); if(!ids.includes("__new")) return;
          const sc=colorCheck(ids).score;
          if(sc>=76){ combos++; found.push({ids, sc:sc - ids.reduce((a,id)=>a+Math.min(5,(byId(id)?.wornCount||0))*0.4,0)}); }
          return; }
        for(const x of f[k]) walk(k+1,[...acc,x]);
      };
      walk(0,[]);
      if(tries>maxTries) break outer;
    }
    found.sort((a,b)=>b.sc-a.sc);
    const examples=[], seen=new Set();
    for(const x of found){ const key=x.ids.filter(id=>id!=="__new").slice(0,2).join(); if(seen.has(key)) continue; seen.add(key); examples.push(x.ids); if(examples.length>=4) break; }
    return {cands, pairs, combos, capped:tries>maxTries, examples};
  } finally {
    const ix=items.indexOf(V); if(ix>=0) items.splice(ix,1);
  }
}
function shopLocalSimilar(res){
  return res.cands.filter(c=>c.sc>=0.5).slice(0,8).map(c=>({id:c.id, level: (c.sc>=1.2 && byId(c.id)?.category===SHOP.d.category) ? "very" : "some"}));
}
function shopRuleVerdict(sim,res){
  const very=sim.filter(x=>x.level==="very"), paired=new Set(Object.values(res.pairs).flat()).size;
  let v;
  if(very.length>=2) return {verdict:"skip", title:t("rtSkip"), text:t("ruleSkip")(very.length)};
  if(very.length===1) return {verdict:"think", title:t("rtSimilar"), text:t("ruleThinkOne")(nameOf(byId(very[0].id)))};
  if(res.combos<3 && items.length>=6) return {verdict:"think", title:t("rtFew"), text:t("ruleFewPairs")};
  return {verdict:"buy", title:t("rtBuy"), text: paired ? t("ruleBuy")(paired) : t("ruleBuyNew")};
}

/* Claude looks at the new piece next to the closest pieces you own and gives advice */
async function shopClaude(file, d, res){
  const cand=res.cands.filter(c=>c.sc>=0.2).slice(0, Math.max(0, Math.min(8, (maxImages||5)-1)));
  const imgs=[await shrink(file,768,0.8)], owned=[];
  for(const c of cand){
    const it=byId(c.id); if(!it) continue;
    try{ const b=await (await fetch(imgSrc(it))).blob(); imgs.push(await shrink(b,384,0.8));
      owned.push({id:it.id, image:imgs.length, name:it.name||it.nameZh||it.category, category:it.category, colors:it.colors||[], timesWorn:it.wornCount||0}); }catch(e){}
  }
  const counts=Object.entries(res.pairs).filter(([,v])=>v.length).map(([c,v])=>`${v.length} ${CAT_PLURAL.en[c].toLowerCase()}`).join(", ") || "nothing yet";
  const lang = LANG==="zh" ? "Simplified Chinese" : "English";
  const prompt=`Image 1 is a clothing item the user is thinking of buying (${d.category}, colors: ${(d.colors||[]).join(", ")||"unknown"}).
${owned.length?`Images 2-${owned.length+1} are pieces they already own:\n${JSON.stringify(owned.map(({id,...o})=>o))}`:"They own nothing of the same kind."}
Their closet has ${items.length} pieces. By color, the new piece goes with: ${counts}. With what they own it would make about ${res.capped?"many":res.combos} new outfits.

1. For each owned image, rate how similar it is to image 1 as a replacement (same kind of garment with similar color, cut and style): "very" = basically the same piece, "some" = similar, would fill a similar role, "no" = different.
2. Give honest, friendly shopping advice: "skip" if they already have something very similar (especially if those are rarely worn), "think" if it is somewhat redundant or hard to combine, "buy" if it fills a gap and combines well.
Write "title" (max 6 words) and "text" (2-3 short sentences; mention owned pieces by a short description, never by image number) in ${lang}.
Reply with JSON only: {"similar":[{"image":2,"level":"very"}],"verdict":"buy","title":"...","text":"..."}`;
  const a=await sample.json(prompt,{images:imgs, modelTier:"default"});
  const sim=[];
  for(const s of (Array.isArray(a?.similar)?a.similar:[])){
    const o=owned.find(x=>x.image===s?.image); if(o && (s.level==="very"||s.level==="some")) sim.push({id:o.id, level:s.level});
  }
  sim.sort((x,y)=>(x.level==="very"?0:1)-(y.level==="very"?0:1));
  const verdict = SHOP_VERDICT[a?.verdict] && typeof a?.text==="string"
    ? {verdict:a.verdict, title:String(a.title||t(SHOP_VERDICT[a.verdict].key)).slice(0,60), text:a.text.slice(0,500)} : null;
  return {sim, verdict};
}

async function shopStart(file){
  if(SHOP.url) URL.revokeObjectURL(SHOP.url);
  const token={};
  SHOP={stage:"busy", step:"id", token, file, url:URL.createObjectURL(file), d:{name:"",nameZh:"",category:"",colors:[],season:"all",notes:"",notesZh:""}, res:null, sim:null, verdict:null, note:""};
  renderShop();
  const live=()=>SHOP.token===token;
  if(!(sample && canSeeImages)){ SHOP.stage="manual"; renderShop(); return; }
  try{ const f=await identify(file); if(!live()) return; mergeDetected(SHOP.d,f); SHOP.d.onPerson=!!f.onPerson; }catch(e){}
  if(!live()) return;
  if(!SHOP.d.category){ SHOP.stage="manual"; SHOP.note=t("shopFail"); renderShop(); return; }
  SHOP.step="compare"; renderShop();
  SHOP.res=shopLocal(SHOP.d);
  try{ const c=await shopClaude(file,SHOP.d,SHOP.res); if(!live()) return; SHOP.sim=c.sim; SHOP.verdict=c.verdict; }catch(e){}
  if(!live()) return;
  SHOP.stage="done"; renderShop();
}
function shopRecompute(note){
  SHOP.res=shopLocal(SHOP.d); SHOP.sim=null; SHOP.verdict=null; SHOP.note=note||""; SHOP.stage="done"; renderShop();
}

      startAdd([file],{prefill:d});

  }

/* ---------- tools: closet insights, declutter, what to buy next, trip packing ---------- */
const DAY_MS=864e5;
const daysSince=d=> d ? (Date.now()-new Date(d.length===10 ? d+"T12:00:00" : d))/DAY_MS : Infinity;
const LIGHT=new Set(["white","beige","grey","pink","yellow"]), DARK=new Set(["black","navy","brown"]);
const lightText=c=>LIGHT.has(c)||c==="pattern";
const TOOLS={view:"overview", th:365, review:null, reviewBusy:false, gaps:null, gapsBusy:false, gapNote:""};
let TRIP=null;
try{ TRIP=JSON.parse(localStorage.getItem("closet-trip")||"null"); }catch(e){ TRIP=null; }
const saveTrip=()=>{ try{ localStorage.setItem("closet-trip",JSON.stringify(TRIP)); }catch(e){} };
const tripDefaults=()=>({days:5, weather:S.today.weather||"mild", ids:[], plan:[], packed:[]});

/* remove pieces and keep saved outfits tidy */
async function deleteItemsAndTidy(ids){
  const r=await deleteMany(ids);
  return {deleted:ids.length-r.failed, failed:r.failed};
}
const ghostPiece=v=>`<span class="ghostpiece" style="background:${COLOR_MAP[v.color]};color:${lightText(v.color)?"#1d2230":"#fff"}">${esc(catOne(v.category))}</span>`;
const comboHtml=(ids,ghost)=>`<div class="combo">${ids.map(id=> id==="__new" ? (ghost?ghostPiece(ghost):"") : (byId(id)?`<img src="${imgSrc(byId(id))}" alt="">`:"")).join("")}</div>`;

/* ===== 1. closet insights ===== */
function closetStats(){
  const n=items.length, byCat={}, byColor={}, bySeason={all:0,ss:0,aw:0};
  for(const i of items){
    byCat[i.category]=(byCat[i.category]||0)+1;
    for(const c of new Set(i.colors||[])) byColor[c]=(byColor[c]||0)+1;
    bySeason[i.season||"all"]=(bySeason[i.season||"all"]||0)+1;
  }
  const old=items.filter(i=>daysSince(i.addedAt)>30);
  const unworn=old.filter(i=>!i.wornCount).length;
  return {n, byCat, byColor, bySeason, unworn, unwornShare: old.length ? unworn/old.length : 0,
    most:[...items].filter(i=>i.wornCount).sort((a,b)=>(b.wornCount||0)-(a.wornCount||0)).slice(0,5),
    never:items.filter(i=>!i.wornCount).sort((a,b)=>(a.addedAt||"").localeCompare(b.addedAt||""))};
}
function closetInsights(st){
  const out=[], n=st.n, cat=c=>st.byCat[c]||0;
  if(n<5) return [{lv:"info", text:t("inTooFew")}];
  const colors=Object.entries(st.byColor).filter(([c])=>c!=="pattern").sort((a,b)=>b[1]-a[1]);
  if(colors.length && n>=8 && colors[0][1]/n>=0.35) out.push({lv:"warn", text:t("inTooMuch")(colorName(colors[0][0]), Math.round(colors[0][1]/n*100))});
  const neutralOnly=items.filter(i=>(i.colors||[]).length && (i.colors||[]).every(c=>NEUTRAL.has(c))).length;
  if(neutralOnly/n>=0.8) out.push({lv:"info", text:t("inAllNeutral")});
  else if(neutralOnly/n<=0.3) out.push({lv:"info", text:t("inFewNeutral")});
  const bottoms=items.filter(i=>i.category==="bottom");
  if(bottoms.length>=2 && !bottoms.some(i=>(i.colors||[]).some(c=>LIGHT.has(c)))) out.push({lv:"warn", text:t("inNoLightBottoms")});
  if(bottoms.length>=2 && !bottoms.some(i=>(i.colors||[]).some(c=>DARK.has(c)))) out.push({lv:"info", text:t("inNoDarkBottoms")});
  if(cat("top")>=6 && cat("top")>=3*Math.max(1,cat("bottom"))) out.push({lv:"warn", text:t("inTopsHeavy")(cat("top"),cat("bottom"))});
  if(cat("bottom")>=6 && cat("bottom")>=2*Math.max(1,cat("top"))) out.push({lv:"info", text:t("inBottomsHeavy")});
  if(!cat("shoes")) out.push({lv:"warn", text:t("inNoShoes")});
  else if(cat("shoes")===1 && n>=10) out.push({lv:"info", text:t("inOneShoes")});
  const m=new Date().getMonth()+1, cold=[10,11,12,1,2,3].includes(m);
  if(cold && !items.some(i=>i.category==="outerwear" && i.season!=="ss")) out.push({lv:"warn", text:t("inNoWarmOuter")});
  const now=cold?"aw":"ss", fit=items.filter(i=>!i.season||i.season==="all"||i.season===now).length;
  if(fit/n<0.4) out.push({lv:"info", text:t("inSeasonThin")(t(cold?"seasonAw":"seasonSs"))});
  if(st.unwornShare>=0.3) out.push({lv:"warn", text:t("inUnworn")(Math.round(st.unwornShare*100)), link:"declutter"});
  if(!out.some(o=>o.lv==="warn")) out.unshift({lv:"good", text:t("inBalanced")});
  return out;
}

      <span class="bl">${colorFn?`<i class="sdot" style="background:${COLOR_MAP[k]}"></i>`:""}${esc(label)}</span>

      <span class="bv">${v}</span></div>`).join("")}</div>`;
}

      ${sample?`<div class="row"><button class="chip" type="button" id="reviewBtn" ${TOOLS.reviewBusy?"disabled":""}>${TOOLS.reviewBusy?t("thinking"):t("askReview")}</button></div>`:""}
      ${TOOLS.review?`<div class="answer"><h4>${t("reviewTitle")}</h4><ul class="review">${TOOLS.review.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}

async function findGaps(){
  TOOLS.gapsBusy=true; TOOLS.gaps=null; TOOLS.gapNote=""; renderTools();
  // tops, bottoms, dresses and shoes create new outfits; outerwear and bags only go on top, so they're suggested only when missing
  const m=new Date().getMonth()+1, cold=[10,11,12,1,2,3].includes(m);
  const riders=[];
  if(!items.some(i=>i.category==="outerwear" && (!cold || i.season!=="ss"))) riders.push("outerwear");
  if(!items.some(i=>i.category==="bag")) riders.push("bag");
  const cats=["top","bottom","dress","shoes",...riders], cands=[];
  for(const c of cats){
    const rider=riders.includes(c);
    for(const col of COLOR_IDS.filter(x=>x!=="pattern")){
      if(items.some(i=>i.category===c && (i.colors||[])[0]===col)) continue;      // you already own one like it
      const r=shopLocal({category:c, colors:[col], season:"all"}, 4000);
      cands.push({category:c, color:col, rider, gain:r.combos, capped:r.capped, examples:r.examples,
        score: rider ? 30+Math.min(r.combos,40)*0.5 : r.combos});
    }
    await new Promise(r=>setTimeout(r,0));
  }
  cands.sort((a,b)=>b.score-a.score);
  const picks=[], perCat={};
  for(const x of cands){ if(x.gain<=0) continue; if((perCat[x.category]||0)>=2) continue; perCat[x.category]=(perCat[x.category]||0)+1; picks.push(x); if(picks.length>=8) break; }
  let list=picks.slice(0,5).map(x=>({...x, name:"", why:""}));
  if(sample && picks.length){
    try{
      const st=closetStats(), lang=LANG==="zh"?"Simplified Chinese":"English";
      const a=await sample.json(`You are a personal stylist. The user's wardrobe: ${JSON.stringify({pieces:st.n, byCategory:st.byCat, byColor:st.byColor, bySeason:st.bySeason})}.
Color-matching tested what one new piece would add. Candidates (index, category, color, new outfits it would unlock):
${picks.map((x,i)=>`${i}: ${x.category}, ${x.color}, ${x.rider?`missing category, goes with ${x.capped?"50+":x.gain} existing outfits`:`${x.capped?"50+":x.gain} new outfits`}`).join("\n")}
Pick the 3 most useful to buy next (consider versatility, gaps, and the season: it is ${new Date().toLocaleString("en",{month:"long"})}). For each, give a concrete product idea ("name", max 6 words, e.g. a cut or fabric) and one sentence "why", in ${lang}.
Reply with JSON only: {"picks":[{"index":0,"name":"...","why":"..."}]}`,{modelTier:"default"});
      const got=(a?.picks||[]).filter(p=>Number.isInteger(p?.index) && picks[p.index]).slice(0,3)
        .map(p=>({...picks[p.index], name:String(p.name||"").slice(0,60), why:String(p.why||"").slice(0,240)}));
      if(got.length) list=got;
    }catch(e){ TOOLS.gapNote=t("gapClaudeFail"); }
  }
  TOOLS.gaps=list; TOOLS.gapsBusy=false; renderTools();
}

/* ===== 4. trip packing ===== */
function tripPool(weather){
  const season=WEATHER[weather].season;
  return items.filter(i=>season==="any" || !i.season || i.season==="all" || i.season===season);
}
function tripOutfits(ids){
  const sel=ids.map(byId).filter(Boolean), of=c=>sel.filter(i=>i.category===c);
  const tops=of("top"), bottoms=of("bottom"), ones=sel.filter(i=>ONE_PIECE.has(i.category));
  const shoes=of("shoes").length?of("shoes"):[null];
  const out=[];
  for(const s of shoes){
    for(const tp of tops) for(const bt of bottoms){ const core=[tp.id,bt.id,s&&s.id].filter(Boolean); const sc=colorCheck(core).score; if(sc>=76) out.push({core,sc}); }
    for(const o of ones){ const core=[o.id,s&&s.id].filter(Boolean); const sc=colorCheck(core).score; if(sc>=76) out.push({core,sc}); }
  }
  return out.sort((a,b)=>b.sc-a.sc);
}
function packTrip(days, weather, jitter){
  const pool=tripPool(weather), r=()=>jitter?Math.random()*0.5:0;
  const garments=pool.filter(i=>["top","bottom","dress","set"].includes(i.category));
  const pairOK=(a,b)=>colorCheck([a,b]).score>=76;
  const compat=id=>garments.filter(g=>g.id!==id && pairOK(id,g.id)).length;
  const pickBest=(list,score)=>list.map(x=>({x,s:score(x)+r()})).sort((a,b)=>b.s-a.s)[0]?.x;
  const chosen=[];
  // shoes that go with the most
  const shoesPool=pool.filter(i=>i.category==="shoes");
  const s1=pickBest(shoesPool,i=>compat(i.id)); if(s1) chosen.push(s1.id);
  if(days>=5){ const s2=pickBest(shoesPool.filter(i=>i.id!==s1?.id && (i.colors||[])[0]!==(s1?.colors||[])[0]),i=>compat(i.id)); if(s2) chosen.push(s2.id); }
  // seed with the most versatile bottom, then add whatever unlocks the most outfits
  const b0=pickBest(garments.filter(i=>i.category==="bottom"),i=>compat(i.id)+(i.wornCount||0)*0.05); if(b0) chosen.push(b0.id);
  const target=Math.max(1,days), minTops=Math.min(Math.ceil(days/2), garments.filter(i=>i.category==="top"||ONE_PIECE.has(i.category)).length);
  for(let step=0; step<14; step++){
    const cur=tripOutfits(chosen).length;
    const tops=chosen.map(byId).filter(i=>i&&(i.category==="top"||ONE_PIECE.has(i.category))).length;
    if(cur>=target && tops>=minTops) break;
    const opts=garments.filter(g=>!chosen.includes(g.id));
    if(!opts.length) break;
    const best=pickBest(opts,g=>(tripOutfits([...chosen,g.id]).length-cur)*10+(g.category==="top"&&tops<minTops?3:0)+Math.min(5,g.wornCount||0)*0.1);
    if(!best) break;
    if(tripOutfits([...chosen,best.id]).length===cur && cur>=1 && tops>=minTops) break;
    chosen.push(best.id);
  }
  const outs=tripOutfits(chosen);
  const fitsMost=list=>pickBest(list,x=>outs.filter(o=>colorCheck([...o.core,x.id]).score>=70).length);
  if(weather!=="warm"){ const ow=fitsMost(pool.filter(i=>i.category==="outerwear")); if(ow) chosen.push(ow.id); }
  const bag=fitsMost(pool.filter(i=>i.category==="bag")); if(bag) chosen.push(bag.id);
  if(weather==="cold"){ const ac=fitsMost(pool.filter(i=>i.category==="accessory")); if(ac) chosen.push(ac.id); }
  // a day-by-day plan: best outfits first, avoid wearing the same top two days in a row
  const plan=[]; let last=null;
  for(let d=0; d<days && outs.length; d++){
    const pick=outs.find(o=>o.core[0]!==last && !plan.slice(-Math.min(outs.length-1,3)).some(p=>p.join()===o.core.join())) || outs[d%outs.length];
    plan.push(pick.core); last=pick.core[0];
  }
  return {ids:chosen, plan, outfits:outs.length};
}
function renderTrip(){
  if(!items.length) return `<p class="note">${t("toolsEmpty")}</p>`;
  const tr=TRIP||tripDefaults();
  const ctrl=`<p class="note" style="max-width:60ch">${t("tripIntro")}</p>
    <div class="tripctl">
      <div><span class="tag">${t("tripDays")}</span><div class="stepper"><button class="chip" type="button" data-days="-1" aria-label="−">−</button><b>${tr.days}</b><button class="chip" type="button" data-days="1" aria-label="+">＋</button></div></div>
      <div><span class="tag">${t("weather")}</span><div class="chips">${Object.keys(WEATHER).map(k=>`<button class="chip" type="button" data-tw="${k}" aria-pressed="${tr.weather===k}">${WEATHER_L[LANG][k]}</button>`).join("")}</div></div>
    </div>
    <div class="row"><button class="btn primary" type="button" id="packBtn">${tr.ids.length?t("repack"):t("pack")}</button></div>`;
  if(!tr.ids.length) return ctrl;
  const sel=tr.ids.map(byId).filter(Boolean);
  if(!sel.length) return ctrl;
  const packed=new Set(tr.packed||[]);
  const groups=CAT_IDS.map(c=>[c,sel.filter(i=>i.category===c)]).filter(([,l])=>l.length);
  const outs=tripOutfits(sel.map(i=>i.id)).length;
  const tip=pickOne(TIPS[LANG][tr.weather]);
  return ctrl+`<div class="detect" role="status">${t("tripSummary")(sel.length,outs,tr.days)}</div>
    ${outs<tr.days?`<p class="note">${t("tripShort")}</p>`:""}
    <section class="shop-sec"><h4>${t("packList")} <span class="note">${t("packedN")(sel.filter(i=>packed.has(i.id)).length,sel.length)}</span></h4>
      <div class="packlist">${groups.map(([c,l])=>`<div><span class="tag">${CAT_PLURAL[LANG][c]}</span>${l.map(i=>`<label class="packrow"><input type="checkbox" data-packed="${i.id}" ${packed.has(i.id)?"checked":""}><img src="${imgSrc(i)}" alt=""><span>${esc(nameOf(i))}</span></label>`).join("")}</div>`).join("")}</div></section>
    <section class="shop-sec"><h4>${t("dayPlan")}</h4>
      <div class="plan">${(tr.plan||[]).map((ids,d)=>`<div class="day"><span class="tag">${t("dayN")(d+1)}</span>${comboHtml(ids.filter(id=>byId(id)))}</div>`).join("")}</div></section>
    <p class="note"><b>${t("tip")}</b> ${esc(tip)}</p>`;
}

const blobToDataUrl = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
function dataUrlToBlob(u){
  const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(u||""); if(!m) throw new Error("bad image");
  const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:m[1]||"image/jpeg"});
}
async function fetchImage(src){ const r=await fetch(src); if(!r.ok) throw new Error("image "+r.status); return blobToDataUrl(await r.blob()); }
const ITEM_FIELDS=["name","nameZh","category","colors","season","notes","notesZh","addedAt","wornCount","lastWorn","onPerson","demo"];
const OUTFIT_FIELDS=["name","nameZh","itemIds","createdAt","wornCount","lastWorn","demo"];
const pickFields=(o,f)=>{ const r={}; for(const k of f) if(o[k]!==undefined) r[k]=o[k]; return r; };

function openBackup(){
  let last=""; try{ last=localStorage.getItem("closet-last-backup")||""; }catch(e){}
  let withDemo=false;
  const draw=(msg,busy)=>{
    const list=items.filter(i=>withDemo||!i.demo);
    openSheet(`<div class="head"><h2>${t("backupTitle")}</h2><button class="x" type="button" aria-label="${t("close")}">×</button></div>
      <p style="margin:0;max-width:60ch">${t("backupIntro")}</p>
      ${items.some(i=>i.demo)?`<label class="toggle"><input type="checkbox" id="bkDemo" ${withDemo?"checked":""}> ${t("includeDemo")}</label>`:""}
      <div class="row"><button class="btn primary" type="button" id="bkExport" ${busy||!list.length?"disabled":""}>${t("exportBtn")}</button>
        <span class="note" style="align-self:center">${t("backupSize")(list.length, Math.max(1,Math.round(list.reduce((a,i)=>a+0.25*(1+extraPhotos(i).length),0))))}</span></div>
      ${last?`<p class="note">${t("lastBackup")(new Date(last).toLocaleString(LANG==="zh"?"zh-CN":undefined,{dateStyle:"medium",timeStyle:"short"}))}</p>`:""}
      <hr style="border:0;border-top:1px solid var(--line);margin:4px 0;width:100%">
      <p class="note" style="max-width:60ch">${t("importIntro")}</p>
      <div class="row"><button class="btn" type="button" id="bkImport" ${busy||!(assets||local)?"disabled":""}>${t("importBtn")}</button>
        <input type="file" id="bkFile" accept=".json,application/json" hidden></div>
      ${msg?`<div class="detect ${msg.fail?"fail":""}" role="status">${msg.busy?'<span class="spin" aria-hidden="true"></span>':""}${esc(msg.text)}</div>`:""}`, root=>{
      root.querySelector("#bkDemo")?.addEventListener("change",e=>{ withDemo=e.target.checked; draw(); });
      root.querySelector("#bkExport").onclick=()=>doExport();
      root.querySelector("#bkImport").onclick=()=>root.querySelector("#bkFile").click();
      root.querySelector("#bkFile").onchange=e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) doImport(f); };
    });
  };
  const doExport=async()=>{
    if(!downloads){ draw({text:t("exportUnavailable"),fail:true}); return; }
    const list=items.filter(i=>withDemo||!i.demo);
    const ids=new Set(list.map(i=>i.id));
    const total=list.reduce((a,i)=>a+1+extraPhotos(i).length,0); let done=0;
    try{
      const outItems=[];
      for(const it of list){
        draw({text:t("packing")(done,total),busy:true},true);
        const rec={id:it.id, ...pickFields(it,ITEM_FIELDS), image:await fetchImage(imgSrc(it)), photos:[]}; done++;
        for(const ph of extraPhotos(it)){ rec.photos.push({kind:ph.kind, image:await fetchImage(blobSrc(ph.id))}); done++; }
        outItems.push(rec);
      }
      const outOutfits=outfits.filter(o=>o.itemIds.every(x=>ids.has(x))).map(o=>({id:o.id,...pickFields(o,OUTFIT_FIELDS)}));
      const json=JSON.stringify({app:"my-closet",version:1,exportedAt:new Date().toISOString(),items:outItems,outfits:outOutfits});
      await downloads.save({filename:`closet-backup-${today()}.json`, data:new Blob([json],{type:"application/json"})});
      try{ last=new Date().toISOString(); localStorage.setItem("closet-last-backup",last); }catch(e){}
      draw({text:t("exportDone")});
    }catch(e){
      const c=e?.code;
      draw({text: c==="declined" ? t("exportDeclined") : (["unavailable","not_granted","capability_disabled","capability_removed"].includes(c) ? t("exportUnavailable") : t("exportFail")), fail:true});
    }
  };
  const doImport=async file=>{
    let data;
    try{ data=JSON.parse(await file.text()); if(data?.app!=="my-closet" || !Array.isArray(data.items)) throw 0; }
    catch(e){ draw({text:t("importBad"),fail:true}); return; }
    const have=new Set(items.flatMap(i=>[i.id,i.srcId].filter(Boolean)));
    let added=0, skipped=0, failed=0, n=0;
    for(const rec of data.items){
      n++; draw({text:t("importing")(n,data.items.length),busy:true},true);
      if(!rec?.id || have.has(rec.id)){ skipped++; continue; }
      try{
        const fields=pickFields(rec,ITEM_FIELDS);
        if(!CAT_IDS.includes(fields.category)) throw new Error("category");
        const main=dataUrlToBlob(rec.image);
        if(local){
          const photos=(rec.photos||[]).map(ph=>({id:URL.createObjectURL(dataUrlToBlob(ph.image)),kind:ph.kind}));
          items.push({id:rec.id,...fields,srcId:rec.id,localUrl:URL.createObjectURL(main),photos});
        } else {
          const up=await assets.upload(main);
          const photos=[];
          for(const ph of rec.photos||[]){ const u=await assets.upload(dataUrlToBlob(ph.image)); photos.push({id:u.id,kind:ph.kind==="back"?"back":(ph.kind==="front"?"front":"detail")}); }
          await db.doc("items/"+rec.id).set({...fields,srcId:rec.id,assetId:up.id,photos});
        }
        have.add(rec.id); added++;
      }catch(e){ failed++; }
    }
    let addedOutfits=0;
    const haveOutfits=new Set(outfits.flatMap(o=>[o.id,o.srcId].filter(Boolean)));
    for(const o of data.outfits||[]){
      if(!o?.id || haveOutfits.has(o.id) || !Array.isArray(o.itemIds) || !o.itemIds.every(x=>have.has(x))) continue;
      try{
        const fields={...pickFields(o,OUTFIT_FIELDS),srcId:o.id};
        if(local) outfits.push({id:o.id,...fields}); else await db.doc("outfits/"+o.id).set(fields);
        addedOutfits++;
      }catch(e){}
    }
    if(local) render();
    draw({text: failed ? t("importFail")(failed) : t("importDone")(added,addedOutfits,skipped), fail:!!failed});
  };
  draw();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ bounceTab(b); S.tab=b.dataset.tab; rememberUi(); render(); }
  else if(b.dataset.cat){ S.cat=b.dataset.cat; renderCloset(); }
  else if(b.dataset.item){ if(SEL.on) toggleSel(b.dataset.item); else openItem(b.dataset.item); }
  else if(b.dataset.osel) toggleSel(b.dataset.osel);
  else if(b.dataset.style) styleAround(b.dataset.style);
  else if(b.dataset.act==="add") $("#fileIn").click();
  else if(b.dataset.goto){ S.tab=b.dataset.goto; render(); }
  else if(b.dataset.step) step(b.dataset.step,+b.dataset.dir);
  else if(b.dataset.flip){ S.mix.flip=S.mix.flip||{}; S.mix.flip[b.dataset.flip]=!S.mix.flip[b.dataset.flip]; renderMix(); }
  else if(b.dataset.lock){ S.mix.locks[b.dataset.lock]=!S.mix.locks[b.dataset.lock]; renderMix._pop=b.dataset.lock; renderMix(); }
  else if(b.dataset.wear){ const o=outfits.find(x=>x.id===b.dataset.wear); markWorn(o).then(()=>toast(t("loggedWorn"))).catch(()=>toast(t("saveFailShort"))); }
  else if(b.dataset.load){ const o=outfits.find(x=>x.id===b.dataset.load);
    SLOTS.forEach(s=>{ S.mix.slots[s.id]=null; S.mix.locks[s.id]=false; });
    o.itemIds.forEach(id=>{ const it=byId(id); if(!it) return; const s=ONE_PIECE.has(it.category)?"top":it.category; S.mix.slots[s]=id; S.mix.locks[s]=true; });
    renderMix.started=true; S.today.answer=null; S.tab="mix"; render(); }
  else if(b.dataset.delout){
    if(b.dataset.armed) deleteOutfit(b.dataset.delout).then(()=>toast(t("outfitDeleted")));
    else { b.dataset.armed="1"; b.textContent=t("tapAgain"); }
  }
});
function toggleLang(){ LANG = LANG==="zh"?"en":"zh"; try{ localStorage.setItem("closet-lang",LANG); }catch(e){}
  setTimeout(translateMissingNotes,300);
  S.today.answer=null; applyLang(); render(); }
function openMore(){
  openSheet(`<div class="head"><h2>${t("more")}</h2><button class="x" type="button" aria-label="${t("close")}">×</button></div>
    <div class="menu">
      <button type="button" id="mStyle"><span>${t("styleBtn")}</span><span class="note">${t("sk_"+SKIN)}</span></button>
      <button type="button" id="mBackup"><span>${t("backupTitle")}</span><span class="note">${t("exportBtn")} · ${t("importBtn")}</span></button>
      <button type="button" id="mLang" lang="${LANG==="zh"?"en":"zh"}"><span>${LANG==="zh"?"English":"中文"}</span><span class="note">${t("langNote")}</span></button>
    </div>`, root=>{
    root.querySelector("#mStyle").onclick=()=>openSkins();
    root.querySelector("#mBackup").onclick=()=>openBackup();
    root.querySelector("#mLang").onclick=()=>{ closeSheet(); toggleLang(); };
  });
}
$("#addBtn").onclick=()=>$("#fileIn").click();
$("#moreBtn").onclick=()=>openMore();
$("#selDone").onclick=()=>{ endSelect(); render(); };
$("#selAll").onclick=()=>{ const all=SEL.visible.every(id=>SEL.ids.has(id)); SEL.ids = all ? new Set() : new Set(SEL.visible); SEL.armed=false; applySel(); };
$("#selDelete").onclick=()=>{ if(!SEL.ids.size||SEL.busy) return; if(!SEL.armed){ SEL.armed=true; renderSelBar(); return; } deleteSelected(); };
$("#fileIn").onchange=e=>{ const f=e.target.files; if(f&&f.length) startAdd(f); e.target.value=""; };
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{ e.preventDefault(); if(e.dataTransfer.files.length && (assets||local)) startAdd(e.dataTransfer.files); });
$("#removeDemo").onclick=async e=>{
  const b=e.currentTarget;
  if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=t("tapAgainRemove"); return; }
  b.disabled=true; b.textContent=t("removing");
  const demoIds=items.filter(i=>i.demo).map(i=>i.id);
  const demoOutfits=outfits.filter(o=>o.demo || o.itemIds.every(id=>demoIds.includes(id))).map(o=>o.id);
  toast(t("demoRemoved"));
  const r=await deleteMany(demoIds, demoOutfits);
  if(r.failed) toast(t("demoRemoveFail"));
  b.disabled=false; delete b.dataset.armed; b.textContent=t("removeDemo");
};

/* photos fade in as they arrive (never stay hidden: errors and cached images show at once) */
(function(){
  const arm=img=>{ if(img.classList.contains("in")) return;
    if(img.complete && img.naturalWidth) { img.classList.add("in","now"); return; }
    const done=()=>img.classList.add("in"); img.addEventListener("load",done,{once:true}); img.addEventListener("error",done,{once:true});
    setTimeout(done,4000); };
  const scan=n=>{ if(n.nodeType!==1) return; if(n.tagName==="IMG") arm(n); else n.querySelectorAll?.("img").forEach(arm); };
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(scan))).observe(document.body,{childList:true,subtree:true});
  document.querySelectorAll("img").forEach(arm);
})();

boot();
